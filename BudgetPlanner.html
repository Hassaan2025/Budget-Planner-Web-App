function modalShell(title, body) {
  return '<div class="dlg-head"><h2 id="dlgTitle">' + esc(title) + '</h2><button type="button" class="icon-btn" data-action="modal-close" aria-label="Close">' + icon('close') + '</button></div>' + body;
}

function findById(list, id) {
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

var modalPreset = {};
function openModal(kind, id, preset) {
  var builder = MODALS[kind];
  if (!builder) return;
  modalPreset = preset || {};
  var html = builder(id || '');
  modalPreset = {};
  var dlg = $('#dlg');
  if (html == null) { ui.modal = null; saveUiSoon(); return; }
  ui.modal = { kind: kind, id: id || '' };
  saveUiSoon();
  $('#dlgBody').innerHTML = html;
  restoreDrafts($('#dlgBody'));
  showDialog(dlg);
  var first = $('#dlgBody input:not([type=hidden]):not([type=radio]), #dlgBody select, #dlgBody .sheet-grid button');
  if (first) { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }
}

function closeModal() {
  var dlg = $('#dlg');
  var form = $('#dlgBody form[data-draft]');
  if (form) clearDraft(form.dataset.draft);
  ui.modal = null;
  saveUiSoon();
  if (dlg.open) dlg.close(); else dlg.removeAttribute('open');
}

/* ----- Form handlers ----- */
function readTxForm(form, errId) {
  var v = readForm(form);
  var amount = parseMoney(v.amount, localeDecimal());
  if (amount == null || amount <= 0) { showError(form, errId, 'Enter an amount above zero, for example 12' + localeDecimal() + '50.', 'amount'); return null; }
  if (!isValidYmd(v.date)) { showError(form, errId, 'Choose a date.', 'date'); return null; }
  var type = v.type === 'income' ? 'income' : 'expense';
  var cat = catById(v.category);
  if (!cat || cat.type !== type) { showError(form, errId, 'Choose a category.', 'category'); return null; }
  return { type: type, amount: amount, categoryId: cat.id, date: v.date, note: cleanText(v.note, 140) };
}

function saveBill(form, id, errId) {
  var v = readForm(form);
  var name = cleanText(v.name, 60);
  if (!name) { showError(form, errId, 'Give the bill a name.', 'name'); return; }
  var amount = parseMoney(v.amount, localeDecimal());
  if (amount == null || amount <= 0) { showError(form, errId, 'Enter the amount you pay each month.', 'amount'); return; }
  var day = Number(v.dueDay);
  if (!Number.isInteger(day) || day < 1 || day > 31) { showError(form, errId, 'Enter the day of the month it is due, from 1 to 31.', 'dueDay'); return; }
  var cat = catById(v.category);
  var bill = { name: name, amount: amount, dueDay: day, categoryId: cat && cat.type === 'expense' ? cat.id : 'c-other', subscription: v.subscription === '1' };
  if (id) {
    commit(function (d) {
      var b = findById(d.bills, id);
      if (!b) return false;
      Object.keys(bill).forEach(function (k) { b[k] = bill[k]; });
    }, { toast: 'Bill saved.', undo: true });
    closeModal();
  } else {
    bill.id = uid('b');
    clearDraft('billAdd');
    commit(function (d) { d.bills.push(bill); }, { toast: 'Added “' + name + '”.', undo: true });
  }
}

function saveGoal(form, id, errId) {
  var v = readForm(form);
  var name = cleanText(v.name, 60);
  if (!name) { showError(form, errId, 'Give the goal a name.', 'name'); return; }
  var target = parseMoney(v.target, localeDecimal());
  if (target == null || target <= 0) { showError(form, errId, 'Enter the amount you want to save.', 'target'); return; }
  var saved = v.saved && v.saved.trim() ? parseMoney(v.saved, localeDecimal()) : 0;
  if (saved == null || saved < 0) { showError(form, errId, 'Enter how much you have saved so far, or leave it empty.', 'saved'); return; }
  if (v.targetDate && !isValidYmd(v.targetDate)) { showError(form, errId, 'Choose a valid target date, or leave it empty.', 'targetDate'); return; }
  var goal = { name: name, target: target, saved: saved, targetDate: v.targetDate || '' };
  if (id) {
    commit(function (d) {
      var g = findById(d.goals, id);
      if (!g) return false;
      Object.keys(goal).forEach(function (k) { g[k] = goal[k]; });
    }, { toast: 'Goal saved.', undo: true });
    closeModal();
  } else {
    goal.id = uid('g');
    clearDraft('goalAdd');
    commit(function (d) { d.goals.push(goal); }, { toast: 'Added “' + name + '”.', undo: true });
  }
}

function saveDebt(form, id, errId) {
  var v = readForm(form);
  var name = cleanText(v.name, 60);
  if (!name) { showError(form, errId, 'Give the debt a name.', 'name'); return; }
  var balance = parseMoney(v.balance, localeDecimal());
  if (balance == null || balance < 0) { showError(form, errId, 'Enter how much you owe.', 'balance'); return; }
  var rateCents = v.rate && v.rate.trim() ? parseMoney(v.rate.replace('%', ''), localeDecimal()) : 0;
  if (rateCents == null || rateCents < 0 || rateCents > 10000) { showError(form, errId, 'Enter the yearly interest rate as a number between 0 and 100.', 'rate'); return; }
  var min = v.minPayment && v.minPayment.trim() ? parseMoney(v.minPayment, localeDecimal()) : 0;
  if (min == null || min < 0) { showError(form, errId, 'Enter the minimum monthly payment.', 'minPayment'); return; }
  if (balance > 0 && min <= 0) { showError(form, errId, 'Enter a minimum monthly payment above zero.', 'minPayment'); return; }
  var debt = { name: name, balance: balance, rate: rateCents / 100, minPayment: min };
  if (id) {
    commit(function (d) {
      var x = findById(d.debts, id);
      if (!x) return false;
      Object.keys(debt).forEach(function (k) { x[k] = debt[k]; });
    }, { toast: 'Debt saved.', undo: true });
    closeModal();
  } else {
    debt.id = uid('d');
    clearDraft('debtAdd');
    commit(function (d) { d.debts.push(debt); }, { toast: 'Added “' + name + '”.', undo: true });
  }
}

/* ----- Event wiring ----- */
function wireEvents() {
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-action]') : null;
    if (monthPickerOpen && !e.target.closest('#monthPop') && !(el && el.dataset.action === 'month-picker')) closeMonthPicker(false);
    if (!el || el.disabled) return;
    var fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target;
    var fn = form.dataset && FORMS[form.dataset.form];
    if (!fn) return;
    e.preventDefault();
    fn(form);
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    var form = el.closest && el.closest('form[data-draft]');
    if (form) saveDraft(form);
    if (el.hasAttribute && el.hasAttribute('data-month-note')) {
      var ns = $('#noteState');
      if (ns) ns.textContent = 'Saving…';
      saveMonthNote(el);
    }
    if (el.dataset.filter === 'search') {
      ui.txFilters.search = el.value.slice(0, 80);
      txLimit = 150;
      saveUiSoon();
      var list = $('#txList');
      if (list) list.innerHTML = txListHtml();
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    var form = el.closest && el.closest('form[data-draft]');
    if (el.name === 'type' && form) { syncCategorySelect(form); saveDraft(form); }
    if (el.dataset.filter && el.dataset.filter !== 'search') {
      ui.txFilters[el.dataset.filter] = el.value;
      txLimit = 150;
      saveUiSoon();
      var list = $('#txList');
      if (list) list.innerHTML = txListHtml();
    }
    if (el.dataset.setting) changeSetting(el.dataset.setting, el.value);
    if (el.hasAttribute('data-budget')) changeBudget(el);
    if (el.hasAttribute('data-debt-extra')) changeDebtExtra(el);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && monthPickerOpen) { e.preventDefault(); closeMonthPicker(true); }
    // Keyboard shortcuts: Ctrl+N (or Alt+N) opens Quick add, ? opens help for the current page.
    var isN = e.code === 'KeyN' || e.key === 'n' || e.key === 'N';
    if (isN && !e.shiftKey && !e.metaKey && (e.ctrlKey !== e.altKey) && data && ui) {
      e.preventDefault();
      if (!anyDialogOpen()) {
        if (monthPickerOpen) closeMonthPicker(false);
        openModal('tx', '');
      }
      return;
    }
    if (!e.ctrlKey && !e.metaKey && !e.altKey && !isTyping(e.target) && !anyDialogOpen() && data && ui) {
      if (e.key === '?') { e.preventDefault(); openTip(ui.page); return; }
    }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-budget], [data-debt-extra]')) {
      e.preventDefault();
      e.target.blur();
    }
  });

  var dlg = $('#dlg');
  dlg.addEventListener('close', function () {
    if (ui.modal) {
      var form = $('#dlgBody form[data-draft]');
      if (form) clearDraft(form.dataset.draft);
      ui.modal = null;
      saveUiSoon();
    }
  });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) closeModal(); });
  var tipDlg = $('#tipDlg');
  tipDlg.addEventListener('click', function (e) { if (e.target === tipDlg) closeTip(); });
  document.addEventListener('focusout', function (e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-month-note')) saveMonthNote.flush();
  });

  $('#fileJson').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) restoreBackupFile(f);
  });
  $('#fileCsv').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) importCsvFile(f);
  });

  window.addEventListener('scroll', debounce(function () {
    ui.scroll[ui.page] = Math.round(window.scrollY || 0);
    saveUiSoon();
  }, 200), { passive: true });

  var lastWidth = window.innerWidth;
  window.addEventListener('resize', debounce(function () {
    // Redraw so charts match the new width (ignore tiny changes such as a phone's address bar).
    if (Math.abs(window.innerWidth - lastWidth) > 40 && !$('#dlg').open && !monthPickerOpen) {
      lastWidth = window.innerWidth;
      render();
    }
  }, 200));

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      saveUiNow();
      snapshotIfChanged('Switched away from the page');
    }
  });
  window.addEventListener('pagehide', function () {
    saveMonthNote.flush();
    saveUiNow();
    snapshotIfChanged('Left the page');
  });
  window.addEventListener('beforeunload', function (e) {
    saveUiNow();
    var r = data && data.settings.closeReminder;
    var n = data ? data.meta.unsaved : 0;
    if ((r === 'any' && n > 0) || (r === 'smart' && n >= 5)) {
      if (fsa.state === 'active') return; // the automatic file is already up to date
      e.preventDefault();
      e.returnValue = '';
      return '';
    }
  });

  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (data && data.settings.theme === 'system') { applyTheme(); render(); }
    });
  } catch (e) { /* older Safari: theme still follows on reload */ }
}

function changeSetting(key, value) {
  if (key === 'name') {
    var name = cleanText(value, 40);
    if (name === data.settings.name) return;
    commit(function (d) { d.settings.name = name; }, { toast: 'Name saved.' });
  } else if (key === 'currency' || key === 'locale') {
    commit(function (d) { d.settings[key] = value; });
    fmtCache = {};
    render();
  } else if (key === 'closeReminder') {
    commit(function (d) { d.settings.closeReminder = value; }, { toast: 'Reminder setting saved.' });
  }
}

function changeBudget(el) {
  var id = el.getAttribute('data-budget');
  var raw = el.value.trim();
  var cents = raw ? parseMoney(raw, localeDecimal()) : 0;
  if (cents == null || cents < 0) {
    el.setAttribute('aria-invalid', 'true');
    toast('Enter an amount like 250 or 250' + localeDecimal() + '50.');
    return;
  }
  var c = catById(id);
  if (!c || c.budget === cents) { el.value = cents ? centsToInput(cents) : ''; return; }
  commit(function (d) { var cc = catById(id); cc.budget = cents; }, { toast: c.name + ' set to ' + money(cents) + ' a month.', undo: true });
}

function changeDebtExtra(el) {
  var raw = el.value.trim();
  var cents = raw ? parseMoney(raw, localeDecimal()) : 0;
  if (cents == null || cents < 0) { el.setAttribute('aria-invalid', 'true'); toast('Enter an amount like 100.'); return; }
  if (cents === data.debtExtra) return;
  commit(function (d) { d.debtExtra = cents; }, { toast: 'Extra payment set to ' + money(cents) + ' a month.', undo: true });
}

/* ----- Theme and accent ----- */
function applyTheme() {
  var s = data ? data.settings : { theme: 'system', accent: 'spruce' };
  var dark = s.theme === 'dark';
  if (s.theme === 'system') {
    try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; }
  }
  var root = document.documentElement;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  var a = (ACCENTS[s.accent] || ACCENTS.spruce)[dark ? 'dark' : 'light'];
  root.style.setProperty('--accent', a[0]);
  root.style.setProperty('--accent-text', a[1]);
  root.style.setProperty('--accent-soft', a[2]);
  root.style.setProperty('--on-accent', a[3]);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0e1312' : '#eef2f1');
}

/* ---------- 8. Files: backup (JSON), editable file (CSV), automatic backup file ---------- */

function downloadFile(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    return true;
  } catch (e) {
    toast('Your browser would not save the file. ' + (e && e.message ? e.message : ''));
    return false;
  }
}

function readFileText(file) {
  if (file.size > 25 * 1024 * 1024) return Promise.reject(new Error('This file is too large to be a planner file.'));
  if (typeof file.text === 'function') return file.text();
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result || '')); };
    r.onerror = function () { reject(new Error('The file could not be read.')); };
    r.readAsText(file);
  });
}

function backupPayload() {
  return JSON.stringify({ app: APP_ID, kind: 'backup', version: DATA_VERSION, exportedAt: new Date().toISOString(), data: data });
}

function saveBackupFile() {
  var name = 'budget-planner-backup-' + todayStr() + '.json';
  if (downloadFile(name, backupPayload(), 'application/json')) {
    takeSnapshot('Saved a backup file');
    markBackedUp();
    render();
    toast('Backup saved as ' + name + '. Keep it somewhere safe, like a cloud drive or USB stick.');
  }
}

function countsHtml(d) {
  return '<ul class="small">' +
    '<li>' + d.transactions.length + ' transactions</li><li>' + d.categories.length + ' categories</li>' +
    '<li>' + d.bills.length + ' bills</li><li>' + d.goals.length + ' savings goals</li><li>' + d.debts.length + ' debts</li>' +
    '<li>' + d.milestones.length + ' milestones</li><li>' + d.envelopes.length + ' envelopes</li><li>' + d.plannerItems.length + ' planner entries</li></ul>';
}

function restoreBackupFile(file) {
  readFileText(file).then(function (text) {
    var obj = safeJsonParse(String(text).replace(/^﻿/, ''));
    if (!obj || obj.app !== APP_ID) throw new Error('This file is not a Budget Planner backup. Choose a file whose name starts with “budget-planner-backup”.');
    var raw = obj.kind === 'backup' && obj.data ? obj.data : obj;
    if (typeof obj.version === 'number' && obj.version > DATA_VERSION) throw new Error('This backup comes from a newer version of the planner.');
    var parsed = normalizeData(raw);
    var when = obj.exportedAt && !isNaN(Date.parse(obj.exportedAt)) ? ' saved on ' + dateTimeLabel(Date.parse(obj.exportedAt)) : '';
    return confirmBox({
      title: 'Restore this backup?',
      html: '<p>The backup' + esc(when) + ' contains:</p>' + countsHtml(parsed) +
        '<p>It will replace what is in the planner now. A snapshot of your current data is taken first, so you can undo this.</p>',
      yes: 'Restore backup'
    }).then(function (ok) {
      if (!ok) return;
      parsed.meta.unsaved = 0;
      replaceData(parsed, 'Before restoring a backup file', 'Backup restored.');
      data.meta.unsaved = 0;
      saveData();
    });
  }).catch(function (e) {
    confirmBox({ title: 'That file could not be restored', html: '<p>' + esc(e && e.message ? e.message : 'The file could not be read.') + '</p><p>Nothing in your planner has changed.</p>', yes: 'OK', no: 'Close' });
  });
}

/* ----- Editable CSV file ----- */

var CSV_COLUMNS = ['Record', 'Name', 'Type', 'Category', 'Amount', 'Date', 'Note', 'Due day', 'Subscription', 'Saved', 'Interest rate', 'Minimum payment', 'Colour', 'ID', 'Linked bill', 'Bill month',
  'Month', 'Linked goal', 'Done', 'Important', 'Time', 'From', 'To', 'Spending limit', 'Review'];

/** Stop spreadsheet apps treating text as a formula. The leading apostrophe is removed again on import. */
function guardCell(text) {
  text = String(text == null ? '' : text);
  return /^[=+\-@\t\r']/.test(text) ? "'" + text : text;
}
function unguardCell(text) {
  text = String(text == null ? '' : text);
  return text.charAt(0) === "'" ? text.slice(1) : text;
}

function csvField(value) {
  var s = String(value == null ? '' : value);
  return /[",;\r\n\t]|^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvRow(obj) {
  return CSV_COLUMNS.map(function (c) { return csvField(obj[c]); }).join(',');
}

function buildCsv() {
  var rows = [CSV_COLUMNS.join(',')];
  rows.push(csvRow({ Record: 'Planner', Name: 'Budget Planner editable file', Type: String(DATA_VERSION), Note: 'Keep the first row and the Record column as they are. Amounts use a dot for decimals. Dates are year-month-day.' }));
  rows.push(csvRow({ Record: 'Setting', Name: 'Your name', Note: guardCell(data.settings.name) }));
  rows.push(csvRow({ Record: 'Setting', Name: 'Currency', Note: data.settings.currency }));
  rows.push(csvRow({ Record: 'Setting', Name: 'Extra debt payment', Amount: centsToPlain(data.debtExtra) }));
  data.categories.forEach(function (c) {
    rows.push(csvRow({ Record: 'Category', Name: guardCell(c.name), Type: c.type === 'income' ? 'Income' : 'Expense', Amount: centsToPlain(c.budget), Colour: c.color, ID: c.id }));
  });
  data.bills.forEach(function (b) {
    rows.push(csvRow({ Record: 'Bill', Name: guardCell(b.name), Category: guardCell(catName(b.categoryId)), Amount: centsToPlain(b.amount), 'Due day': b.dueDay, Subscription: b.subscription ? 'Yes' : 'No', ID: b.id }));
  });
  data.goals.forEach(function (g) {
    rows.push(csvRow({ Record: 'Goal', Name: guardCell(g.name), Amount: centsToPlain(g.target), Saved: centsToPlain(g.saved), Date: g.targetDate, ID: g.id }));
  });
  data.debts.forEach(function (x) {
    rows.push(csvRow({ Record: 'Debt', Name: guardCell(x.name), Amount: centsToPlain(x.balance), 'Interest rate': String(x.rate), 'Minimum payment': centsToPlain(x.minPayment), ID: x.id }));
  });
  data.transactions.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (t) {
    rows.push(csvRow({
      Record: 'Transaction', Type: t.type === 'income' ? 'Income' : 'Expense', Category: guardCell(catName(t.categoryId)),
      Amount: centsToPlain(t.amount), Date: t.date, Note: guardCell(t.note), ID: t.id, 'Linked bill': t.billId || '', 'Bill month': t.billMonth || ''
    }));
  });
  data.milestones.forEach(function (x) {
    rows.push(csvRow({ Record: 'Milestone', Name: guardCell(x.title), Amount: x.goalId ? centsToPlain(x.amount) : '', Date: x.dueDate, Note: guardCell(x.note),
      'Linked goal': x.goalId, Done: x.done ? 'Yes' : 'No', ID: x.id }));
  });
  data.envelopes.forEach(function (e) {
    rows.push(csvRow({ Record: 'Envelope', Name: guardCell(e.name), Amount: centsToPlain(e.amount), Category: guardCell(e.categoryIds.map(catName).join(' | ')), Colour: e.color, ID: e.id }));
  });
  data.envelopeMoves.forEach(function (mv) {
    rows.push(csvRow({ Record: 'Envelope move', Month: mv.month, From: mv.from, To: mv.to, Amount: centsToPlain(mv.amount), ID: mv.id }));
  });
  data.plannerItems.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (p) {
    rows.push(csvRow({ Record: 'Planner item', Type: KIND_LABEL[p.kind], Name: guardCell(p.title), Date: p.date, Time: p.time, Important: p.important ? 'Yes' : 'No',
      Done: p.done ? 'Yes' : 'No', Note: guardCell(p.details), ID: p.id }));
  });
  Object.keys(data.monthNotes).sort().forEach(function (k) {
    rows.push(csvRow({ Record: 'Month note', Month: k, Note: guardCell(data.monthNotes[k]) }));
  });
  Object.keys(data.monthPlans).sort().forEach(function (k) {
    var p = data.monthPlans[k];
    rows.push(csvRow({ Record: 'Month plan', Month: k, Amount: centsToPlain(p.income), Saved: centsToPlain(p.savings), 'Spending limit': centsToPlain(p.limit),
      Note: guardCell(p.focus), Review: guardCell(p.review) }));
  });
  return '﻿' + rows.join('\r\n') + '\r\n';
}

function exportCsv() {
  var name = 'budget-planner-' + todayStr() + '.csv';
  if (downloadFile(name, buildCsv(), 'text/csv;charset=utf-8')) {
    markBackedUp();
    render();
    toast('Saved ' + name + '. Open it in Excel, Google Sheets or Numbers.');
  }
}

function detectDelimiter(text) {
  var line = '';
  var inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (ch === '"') inQ = !inQ;
    if (!inQ && (ch === '\n' || ch === '\r')) { if (line.trim()) break; line = ''; continue; }
    line += ch;
  }
  var counts = { ',': 0, ';': 0, '\t': 0 };
  inQ = false;
  for (var j = 0; j < line.length; j++) {
    var c = line.charAt(j);
    if (c === '"') inQ = !inQ;
    else if (!inQ && counts.hasOwnProperty(c)) counts[c]++;
  }
  var best = ',';
  Object.keys(counts).forEach(function (k) { if (counts[k] > counts[best]) best = k; });
  return best;
}

/** RFC 4180 style parser: quoted fields, doubled quotes, newlines inside quotes, CRLF. */
function parseCsv(text, delim) {
  var rows = [], row = [], field = '', inQ = false, i = 0, n = text.length;
  while (i < n) {
    var ch = text.charAt(i);
    if (inQ) {
      if (ch === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"' && field.trim() === '') { field = ''; inQ = true; i++; continue; }
    if (ch === delim) { row.push(field); field = ''; i++; continue; }
    if (ch === '\r' || ch === '\n') {
      row.push(field); rows.push(row); row = []; field = '';
      if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
      i++; continue;
    }
    field += ch; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

var MONTH_WORDS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };

function cleanDateText(s) {
  s = unguardCell(String(s || '').trim());
  // Drop a time part such as "26/10/2026 00:00" or "2026-10-26T00:00:00".
  s = s.replace(/[T\s]+\d{1,2}:\d{2}(:\d{2})?(\s*[AaPp][Mm])?$/, '').trim();
  return s;
}

/** Work out whether a file writes dates day-first or month-first. */
function detectDateOrder(values) {
  var dayFirst = 0, monthFirst = 0;
  values.forEach(function (v) {
    var m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(cleanDateText(v));
    if (!m) return;
    if (Number(m[1]) > 12) dayFirst++;
    else if (Number(m[2]) > 12) monthFirst++;
  });
  if (dayFirst > monthFirst) return 'dmy';
  if (monthFirst > dayFirst) return 'mdy';
  var region = (/[-_]([A-Za-z]{2})\b/.exec(currentLocale()) || [])[1];
  return ['US', 'PH', 'FM', 'MH', 'PW'].indexOf((region || '').toUpperCase()) >= 0 ? 'mdy' : 'dmy';
}

function fullYear(y) {
  y = Number(y);
  if (y < 100) y += y < 70 ? 2000 : 1900;
  return y;
}

function buildYmd(y, m, d) {
  var s = fullYear(y) + '-' + pad2(Number(m)) + '-' + pad2(Number(d));
  return isValidYmd(s) ? s : null;
}

/** Read a date written in almost any spreadsheet style. Returns "YYYY-MM-DD" or null. */
function parseFlexibleDate(value, order) {
  var s = cleanDateText(value);
  if (!s) return null;
  var m;
  if ((m = /^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/.exec(s))) return buildYmd(m[1], m[2], m[3]);
  if ((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(s))) {
    return order === 'mdy' ? buildYmd(m[3], m[1], m[2]) : buildYmd(m[3], m[2], m[1]);
  }
  if ((m = /^(\d{1,2})[\s\-\/.]+([A-Za-z]{3,9})\.?[\s\-\/.,]+(\d{2,4})$/.exec(s))) {
    var mo = MONTH_WORDS[m[2].toLowerCase().slice(0, 4)] || MONTH_WORDS[m[2].toLowerCase().slice(0, 3)];
    return mo ? buildYmd(m[3], mo, m[1]) : null;
  }
  if ((m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{2,4})$/.exec(s))) {
    var mo2 = MONTH_WORDS[m[1].toLowerCase().slice(0, 4)] || MONTH_WORDS[m[1].toLowerCase().slice(0, 3)];
    return mo2 ? buildYmd(m[3], mo2, m[2]) : null;
  }
  if ((m = /^(\d{5})(\.\d+)?$/.exec(s))) {
    // Excel serial date: days since 30 December 1899.
    var serial = Number(m[1]);
    if (serial < 20000 || serial > 80000) return null;
    var d = new Date(1899, 11, 30 + serial);
    return ymd(d);
  }
  return null;
}

function parseCsvMoney(value, hint) {
  var s = unguardCell(String(value == null ? '' : value).trim());
  if (!s) return null;
  return parseMoney(s, hint);
}

/** Read a month such as "2026-11", "2026/11", "Nov-26", "Nov 2026" or a full date. Returns "YYYY-MM" or null. */
function parseMonthText(value, order) {
  var s = cleanDateText(value);
  if (!s) return null;
  var m;
  if ((m = /^(\d{4})[\/.\-](\d{1,2})$/.exec(s)) && Number(m[2]) >= 1 && Number(m[2]) <= 12) return m[1] + '-' + pad2(Number(m[2]));
  if ((m = /^([A-Za-z]{3,9})\.?[\s\-\/]+(\d{2,4})$/.exec(s))) {
    var mo = MONTH_WORDS[m[1].toLowerCase().slice(0, 4)] || MONTH_WORDS[m[1].toLowerCase().slice(0, 3)];
    if (mo) return fullYear(m[2]) + '-' + pad2(mo);
  }
  var d = parseFlexibleDate(s, order);
  return d ? d.slice(0, 7) : null;
}

function parseTimeText(value) {
  var s = unguardCell(String(value || '')).trim();
  var m = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/.exec(s);
  if (!m) return '';
  var h = Number(m[1]);
  if (m[3]) { var pm = /p/i.test(m[3]); if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }
  return h < 24 && Number(m[2]) < 60 ? pad2(h) + ':' + m[2] : '';
}

function yesNo(value) {
  return /^(yes|y|true|1|x|ja|oui|sí|si)$/i.test(unguardCell(String(value || '').trim()));
}

/**
 * Turn the text of an edited CSV file into planner data.
 * Returns { data, skipped, counts } or throws an Error with a plain message.
 */
function csvToData(text) {
  text = String(text || '').replace(/^﻿/, '');
  var sepLine = /^sep=(.)\s*\r?\n/i.exec(text);
  var delim;
  if (sepLine) { delim = sepLine[1]; text = text.slice(sepLine[0].length); }
  else delim = detectDelimiter(text);
  var rows = parseCsv(text, delim);
  while (rows.length && rows[0].every(function (c) { return !String(c).trim(); })) rows.shift();
  if (!rows.length) throw new Error('This file is empty.');

  var header = rows[0].map(function (h) { return String(h).replace(/^﻿/, '').trim().toLowerCase(); });
  var col = {};
  CSV_COLUMNS.forEach(function (name) {
    var idx = header.indexOf(name.toLowerCase());
    if (idx < 0 && name === 'Colour') idx = header.indexOf('color');
    col[name] = idx;
  });
  var required = ['Record', 'Name', 'Type', 'Category', 'Amount', 'Date'];
  if (required.some(function (r) { return col[r] < 0; })) {
    throw new Error('This file is not a Budget Planner editable file. Its first row should start with Record, Name, Type, Category, Amount and Date.');
  }
  function get(row, name) { var i = col[name]; return i >= 0 && i < row.length ? String(row[i]) : ''; }
  function text2(row, name, max) { return cleanText(unguardCell(get(row, name)), max); }

  var hint = delim === ';' ? ',' : delim === ',' ? '.' : localeDecimal();
  var body = rows.slice(1).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); });
  var dateOrder = detectDateOrder(body.map(function (r) { return get(r, 'Date'); }));

  var out = emptyData();
  out.settings = JSON.parse(JSON.stringify(data.settings));
  out.meta.sample = false;
  out.categories = [];
  var envRows = [];
  var skipped = 0, recognised = 0;
  var catRows = [], txRows = [];
  var usedIds = {};
  function freshId(id, prefix) {
    id = cleanText(id, 60);
    if (!id || usedIds[id]) id = uid(prefix);
    usedIds[id] = true;
    return id;
  }

  body.forEach(function (r) {
    var kind = unguardCell(get(r, 'Record')).trim().toLowerCase();
    var name;
    switch (kind) {
      case 'planner':
        recognised++;
        return;
      case 'setting':
        recognised++;
        name = unguardCell(get(r, 'Name')).trim().toLowerCase();
        if (name === 'your name') out.settings.name = text2(r, 'Note', 40);
        else if (name === 'currency') {
          var cur = unguardCell(get(r, 'Note')).trim().toUpperCase();
          if (CURRENCIES.some(function (c) { return c[0] === cur; })) out.settings.currency = cur;
        } else if (name === 'extra debt payment') {
          var ex = parseCsvMoney(get(r, 'Amount'), hint);
          if (ex != null && ex >= 0) out.debtExtra = ex;
        }
        return;
      case 'category': catRows.push(r); recognised++; return;
      case 'transaction': txRows.push(r); recognised++; return;
      case 'bill': {
        recognised++;
        name = text2(r, 'Name', 60);
        var bAmount = parseCsvMoney(get(r, 'Amount'), hint);
        var day = Number(unguardCell(get(r, 'Due day')).trim());
        if (!name || bAmount == null || bAmount < 0 || !Number.isInteger(day) || day < 1 || day > 31) { skipped++; return; }
        out.bills.push({ id: freshId(get(r, 'ID'), 'b'), name: name, amount: bAmount, dueDay: day, categoryName: text2(r, 'Category', 40), subscription: yesNo(get(r, 'Subscription')) });
        return;
      }
      case 'goal': {
        recognised++;
        name = text2(r, 'Name', 60);
        var target = parseCsvMoney(get(r, 'Amount'), hint);
        var saved = get(r, 'Saved').trim() ? parseCsvMoney(get(r, 'Saved'), hint) : 0;
        var gDate = get(r, 'Date').trim() ? parseFlexibleDate(get(r, 'Date'), dateOrder) : '';
        if (!name || target == null || target <= 0 || saved == null || saved < 0 || gDate === null) { skipped++; return; }
        out.goals.push({ id: freshId(get(r, 'ID'), 'g'), name: name, target: target, saved: saved, targetDate: gDate });
        return;
      }
      case 'debt': {
        recognised++;
        name = text2(r, 'Name', 60);
        var bal = parseCsvMoney(get(r, 'Amount'), hint);
        var rateRaw = unguardCell(get(r, 'Interest rate')).replace('%', '').trim();
        var rate = rateRaw ? parseMoney(rateRaw, hint) : 0;
        var min = get(r, 'Minimum payment').trim() ? parseCsvMoney(get(r, 'Minimum payment'), hint) : 0;
        if (!name || bal == null || bal < 0 || rate == null || rate < 0 || rate > 10000 || min == null || min < 0) { skipped++; return; }
        out.debts.push({ id: freshId(get(r, 'ID'), 'd'), name: name, balance: bal, rate: rate / 100, minPayment: min });
        return;
      }
      case 'milestone': {
        recognised++;
        name = text2(r, 'Name', 80);
        var msDate = get(r, 'Date').trim() ? parseFlexibleDate(get(r, 'Date'), dateOrder) : '';
        var msGoal = unguardCell(get(r, 'Linked goal')).trim();
        var msAmount = get(r, 'Amount').trim() ? parseCsvMoney(get(r, 'Amount'), hint) : 0;
        if (!name || msDate === null || msAmount == null || msAmount < 0) { skipped++; return; }
        var msDone = yesNo(get(r, 'Done'));
        out.milestones.push({ id: freshId(get(r, 'ID'), 'm'), title: name, goalId: msGoal, amount: msAmount, dueDate: msDate || '', done: msDone, doneAt: msDone ? Date.now() : 0, note: text2(r, 'Note', 200) });
        return;
      }
      case 'envelope': envRows.push(r); recognised++; return;
      case 'envelope move': {
        recognised++;
        var mvMonth = parseMonthText(get(r, 'Month'), dateOrder);
        var mvAmount = parseCsvMoney(get(r, 'Amount'), hint);
        if (!mvMonth || mvAmount == null || mvAmount <= 0) { skipped++; return; }
        out.envelopeMoves.push({ id: freshId(get(r, 'ID'), 'v'), month: mvMonth, from: unguardCell(get(r, 'From')).trim(), to: unguardCell(get(r, 'To')).trim(), amount: mvAmount });
        return;
      }
      case 'planner item': {
        recognised++;
        name = text2(r, 'Name', 100);
        var pDate = parseFlexibleDate(get(r, 'Date'), dateOrder);
        if (!name || !pDate) { skipped++; return; }
        var kindText = unguardCell(get(r, 'Type')).trim().toLowerCase();
        var kind = /remind/.test(kindText) ? 'reminder' : /note/.test(kindText) ? 'note' : 'task';
        out.plannerItems.push({ id: freshId(get(r, 'ID'), 'p'), title: name, date: pDate, kind: kind, time: parseTimeText(get(r, 'Time')),
          important: yesNo(get(r, 'Important')), done: yesNo(get(r, 'Done')), details: text2(r, 'Note', 400) });
        return;
      }
      case 'month note': {
        recognised++;
        var nMonth = parseMonthText(get(r, 'Month'), dateOrder);
        var nText = cleanText(unguardCell(get(r, 'Note')), 4000);
        if (!nMonth) { skipped++; return; }
        if (nText) out.monthNotes[nMonth] = nText;
        return;
      }
      case 'month plan': {
        recognised++;
        var pMonth = parseMonthText(get(r, 'Month'), dateOrder);
        var money3 = ['Amount', 'Saved', 'Spending limit'].map(function (c) { return get(r, c).trim() ? parseCsvMoney(get(r, c), hint) : 0; });
        if (!pMonth || money3.some(function (x) { return x == null || x < 0; })) { skipped++; return; }
        out.monthPlans[pMonth] = { income: money3[0], savings: money3[1], limit: money3[2], focus: text2(r, 'Note', 200), review: text2(r, 'Review', 1000) };
        return;
      }
      default:
        skipped++;
    }
  });

  if (!recognised) throw new Error('No planner rows were found in this file, so nothing was imported.');

  function typeOf(value) {
    var v = unguardCell(String(value || '')).trim().toLowerCase();
    if (/^(income|money in|in)$/.test(v)) return 'income';
    if (/^(expense|spending|money out|out)$/.test(v)) return 'expense';
    return null;
  }

  catRows.forEach(function (r, i) {
    var name = text2(r, 'Name', 40);
    var type = typeOf(get(r, 'Type'));
    var budget = get(r, 'Amount').trim() ? parseCsvMoney(get(r, 'Amount'), hint) : 0;
    if (!name || !type || budget == null || budget < 0) { skipped++; return; }
    if (out.categories.some(function (c) { return c.type === type && c.name.toLowerCase() === name.toLowerCase(); })) { skipped++; return; }
    out.categories.push({ id: freshId(get(r, 'ID'), 'c'), name: name, type: type, color: cleanColor(unguardCell(get(r, 'Colour')).trim(), i), budget: type === 'expense' ? budget : 0 });
  });
  if (!out.categories.length) out.categories = JSON.parse(JSON.stringify(data.categories));

  function findOrMakeCategory(name, type) {
    var fallback = type === 'income' ? 'c-other-in' : 'c-other';
    if (!name) return fallback;
    var lower = name.toLowerCase();
    for (var i = 0; i < out.categories.length; i++) {
      var c = out.categories[i];
      if (c.type === type && c.name.toLowerCase() === lower) return c.id;
    }
    var id = uid('c');
    out.categories.push({ id: id, name: name, type: type, color: PALETTE[out.categories.length % PALETTE.length], budget: 0 });
    return id;
  }

  out.bills.forEach(function (b) {
    b.categoryId = findOrMakeCategory(b.categoryName, 'expense');
    delete b.categoryName;
  });

  envRows.forEach(function (r, i) {
    var name = text2(r, 'Name', 40);
    var amount = parseCsvMoney(get(r, 'Amount'), hint);
    if (!name || amount == null || amount < 0) { skipped++; return; }
    var cats = unguardCell(get(r, 'Category')).split('|').map(function (x) { return cleanText(x, 40); }).filter(Boolean)
      .map(function (n) { return findOrMakeCategory(n, 'expense'); });
    out.envelopes.push({ id: freshId(get(r, 'ID'), 'e'), name: name, amount: amount, categoryIds: cats, color: cleanColor(unguardCell(get(r, 'Colour')).trim(), i) });
  });

  txRows.forEach(function (r) {
    var type = typeOf(get(r, 'Type'));
    var amount = parseCsvMoney(get(r, 'Amount'), hint);
    var date = parseFlexibleDate(get(r, 'Date'), dateOrder);
    if (!type || amount == null || !date) { skipped++; return; }
    if (amount < 0) { amount = -amount; }
    var tx = { id: freshId(get(r, 'ID'), 't'), type: type, amount: amount, categoryId: findOrMakeCategory(text2(r, 'Category', 40), type), date: date, note: text2(r, 'Note', 140) };
    var billId = unguardCell(get(r, 'Linked bill')).trim();
    var billMonth = unguardCell(get(r, 'Bill month')).trim();
    if (billId && type === 'expense') {
      if (!isValidMonth(billMonth)) {
        var bm = parseFlexibleDate(billMonth + (/^\d{4}-\d{1,2}$/.test(billMonth) ? '-01' : ''), dateOrder);
        billMonth = bm ? bm.slice(0, 7) : date.slice(0, 7);
      }
      tx.billId = billId;
      tx.billMonth = billMonth;
    }
    out.transactions.push(tx);
  });

  var normalized = normalizeData(out);
  return { data: normalized, skipped: skipped };
}

function importCsvFile(file) {
  readFileText(file).then(function (text) {
    var result = csvToData(text);
    var d = result.data;
    return confirmBox({
      title: 'Replace your data with this file?',
      html: '<p>The file contains:</p>' + countsHtml(d) +
        (result.skipped ? '<p class="warn">' + result.skipped + (result.skipped === 1 ? ' row was' : ' rows were') + ' skipped because they could not be read.</p>' : '<p>Every row could be read.</p>') +
        '<p>This replaces what is in the planner now. A snapshot is taken first, so you can undo this.</p>',
      yes: 'Replace my data'
    }).then(function (ok) {
      if (!ok) return;
      replaceData(d, 'Before importing an edited file',
        'Imported ' + d.transactions.length + ' transactions' + (result.skipped ? ', skipped ' + result.skipped + ' rows' : '') + '.');
    });
  }).catch(function (e) {
    confirmBox({ title: 'That file could not be imported', html: '<p>' + esc(e && e.message ? e.message : 'The file could not be read.') + '</p><p>Nothing in your planner has changed.</p>', yes: 'OK', no: 'Close' });
  });
}

/* ----- Automatic backup file (File System Access API: Chrome and Edge on a computer) ----- */

var fsa = { state: 'off', handle: null, fileName: '', lastWrite: 0, writing: false };

function fsaSupported() {
  return typeof window.showSaveFilePicker === 'function';
}

function fsaInit() {
  if (!fsaSupported()) { fsa.state = 'unsupported'; return; }
  idbGet('fileHandle').then(function (handle) {
    if (!handle || typeof handle.queryPermission !== 'function') return;
    fsa.handle = handle;
    fsa.fileName = handle.name || '';
    return handle.queryPermission({ mode: 'readwrite' }).then(function (perm) {
      if (perm === 'granted') { fsa.state = 'active'; fsaWrite(); }
      else { fsa.state = 'needs-permission'; }
      render();
    });
  }).catch(function () { /* leave it off */ });
}

function fsaChoose() {
  if (!fsaSupported()) return;
  window.showSaveFilePicker({
    suggestedName: 'budget-planner-auto-backup.json',
    types: [{ description: 'Budget Planner backup', accept: { 'application/json': ['.json'] } }]
  }).then(function (handle) {
    fsa.handle = handle;
    fsa.fileName = handle.name || '';
    fsa.state = 'active';
    return idbSet('fileHandle', handle).then(function () { return fsaWrite(); });
  }).then(function () {
    render();
    toast('Automatic backup is on. The file updates a moment after each change.');
  }).catch(function (e) {
    if (e && e.name === 'AbortError') return;
    toast('The automatic backup file could not be set up. ' + (e && e.message ? e.message : ''));
  });
}

function fsaWrite() {
  if (fsa.state !== 'active' || !fsa.handle || fsa.writing) return Promise.resolve();
  fsa.writing = true;
  var payload = backupPayload();
  return fsa.handle.createWritable().then(function (w) {
    return w.write(payload).then(function () { return w.close(); });
  }).then(function () {
    fsa.writing = false;
    fsa.lastWrite = Date.now();
    data.meta.unsaved = 0;
    data.meta.lastBackupAt = fsa.lastWrite;
    var json = JSON.stringify(data);
    ls.set(KEY_DATA, json);
    idbSet('data', json);
    if (ui.page === 'settings') {
      var box = document.getElementById('fsaBox');
      if (box) box.innerHTML = fsaInnerHtml();
    }
  }).catch(function () {
    fsa.writing = false;
    fsa.state = 'needs-permission';
    render();
  });
}

var scheduleAutoFile = debounce(function () { if (fsa.state === 'active') fsaWrite(); }, 1500);

function fsaReconnect() {
  if (!fsa.handle || typeof fsa.handle.requestPermission !== 'function') return;
  fsa.handle.requestPermission({ mode: 'readwrite' }).then(function (perm) {
    if (perm === 'granted') {
      fsa.state = 'active';
      return fsaWrite().then(function () { render(); toast('Automatic backup is working again.'); });
    }
    toast('Permission was not given, so the backup file was not updated.');
  }).catch(function () { toast('Permission could not be requested. Try choosing the file again in Settings.'); });
}

function fsaStop() {
  idbDelete('fileHandle');
  fsa.handle = null;
  fsa.fileName = '';
  fsa.state = fsaSupported() ? 'off' : 'unsupported';
  render();
  toast('Automatic backup turned off. The file itself was not deleted.');
}

function fsaInnerHtml() {
  if (fsa.state === 'unsupported') {
    return '<p>This option works only in Chrome and Edge on a computer. It is not available in this browser, or on phones and tablets.</p>' +
      '<p class="small muted">Use Save backup from time to time instead. Your planner still saves itself in this browser after every change.</p>';
  }
  if (fsa.state === 'active') {
    return '<p>Keeping <strong>' + esc(fsa.fileName) + '</strong> up to date after every change.' +
      (fsa.lastWrite ? ' Last updated ' + esc(dateTimeLabel(fsa.lastWrite)) + '.' : '') + '</p>' +
      '<div class="row"><button type="button" class="btn" data-action="fsa-choose">Choose a different file</button><button type="button" class="btn danger" data-action="fsa-stop">Turn off</button></div>';
  }
  if (fsa.state === 'needs-permission') {
    return '<p>Your browser needs your permission again before the planner can update <strong>' + esc(fsa.fileName || 'your backup file') + '</strong>. This is normal after reopening the planner.</p>' +
      '<div class="row"><button type="button" class="btn primary" data-action="fsa-reconnect">Allow updates</button><button type="button" class="btn danger" data-action="fsa-stop">Turn off</button></div>';
  }
  return '<p>Choose a file once, and the planner will keep it updated with a full backup a moment after each change. Put it in a folder that syncs to the cloud for extra safety.</p>' +
    '<p class="small muted">Works in Chrome and Edge on a computer only. Other browsers and phones do not offer this.</p>' +
    '<button type="button" class="btn primary" data-action="fsa-choose">' + icon('file', 18) + 'Choose a backup file</button>';
}

function fsaSettingsHtml() {
  return '<div id="fsaBox">' + fsaInnerHtml() + '</div>';
}

/* ---------- 9. Start-up ---------- */

function tryNormalize(raw) {
  if (!raw) return null;
  try { return normalizeData(typeof raw === 'string' ? safeJsonParse(raw) : raw); } catch (e) { return null; }
}

function requestPersistentStorage() {
  try {
    if (!navigator.storage || typeof navigator.storage.persist !== 'function') return;
    var check = typeof navigator.storage.persisted === 'function' ? navigator.storage.persisted() : Promise.resolve(false);
    check.then(function (already) {
      if (already) return true;
      return navigator.storage.persist();
    }).then(function (granted) {
      storageStatus.persisted = !!granted;
      if (ui && ui.page === 'settings') render();
    }).catch(function () { /* not available here */ });
  } catch (e) { /* not available here */ }
}

function start() {
  if (started) return;
  started = true;
  applyTheme();
  wireEvents();

  var lsData = ls.get(KEY_DATA);
  var lsUi = ls.get(KEY_UI);
  var lsSnaps = safeJsonParse(ls.get(KEY_SNAPS));
  // Probe whether localStorage accepts writes at all.
  if (ls.set('budgetPlanner.v1.probe', '1')) ls.remove('budgetPlanner.v1.probe');

  Promise.all([idbGet('data'), idbGet('ui'), idbGet('snapshots')]).then(function (res) {
    var fromLs = tryNormalize(lsData);
    var fromIdb = tryNormalize(res[0]);
    var notice = '';
    snapshots = mergeSnapshots(Array.isArray(lsSnaps) ? lsSnaps : [], Array.isArray(res[2]) ? res[2] : []);
    pruneSnapshots();

    if (fromLs && fromIdb) {
      data = fromIdb.meta.savedAt > fromLs.meta.savedAt ? fromIdb : fromLs;
    } else if (fromLs) {
      data = fromLs;
    } else if (fromIdb) {
      data = fromIdb;
      notice = 'Your planner’s main storage had been cleared, so your data was recovered from its second copy.';
    } else {
      var fromSnap = null;
      for (var i = 0; i < snapshots.length && !fromSnap; i++) fromSnap = tryNormalize(snapshots[i].json);
      if (fromSnap) {
        data = fromSnap;
        notice = 'Your saved data was missing, so the planner restored your most recent snapshot.';
      } else {
        data = sampleData();
      }
    }
    ui = normalizeUi(safeJsonParse(lsUi) || safeJsonParse(res[1]));
    lastSnapshotJson = snapshots.length ? snapshots[0].json : '';
    saveData();
    saveUiNow();
    render();

    var y = ui.scroll[ui.page] || 0;
    if (y) {
      // Wait a frame so the page has its full height before scrolling.
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }
    if (ui.modal) openModal(ui.modal.kind, ui.modal.id);
    if (notice) toast(notice);
    requestPersistentStorage();
    clockDay = todayStr();
    setInterval(tickClock, 30000);
    initShortcutMode();
    fsaInit();
  }).catch(function (e) {
    // Last resort: run from memory so the page is still usable.
    if (!data) data = sampleData();
    if (!ui) ui = defaultUi();
    render();
    toast('Something went wrong while loading: ' + (e && e.message ? e.message : 'unknown error') + '. Save a backup from Settings.');
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();

})();
</script>

/* ----- Goals ----- */
function goalFormFields(idp, v) {
  return '<label class="field"><span>Goal name</span><input class="input" id="' + idp + 'Name" name="name" maxlength="60" autocomplete="off" value="' + esc(v.name || '') + '" placeholder="For example, Emergency fund"></label>' +
    '<label class="field"><span>Target amount</span><input class="input money" id="' + idp + 'Target" name="target" inputmode="decimal" autocomplete="off" value="' + esc(v.target || '') + '" placeholder="0"></label>' +
    '<label class="field"><span>Saved so far</span><input class="input money" id="' + idp + 'Saved" name="saved" inputmode="decimal" autocomplete="off" value="' + esc(v.saved || '') + '" placeholder="0"></label>' +
    '<label class="field"><span>Target date</span><input class="input" type="date" id="' + idp + 'Date" name="targetDate" value="' + esc(v.targetDate || '') + '"></label>';
}

function goalPlan(g) {
  var remaining = g.target - g.saved;
  if (remaining <= 0) return { text: 'Goal reached. Well done!', monthly: 0, done: true };
  if (!g.targetDate) return { text: 'Add a target date to see how much to put aside each month.', monthly: 0 };
  if (g.targetDate < todayStr()) return { text: 'The target date has passed. ' + money(remaining) + ' still to go.', monthly: 0, late: true };
  var months = Math.max(1, monthsBetween(thisMonth(), g.targetDate.slice(0, 7)));
  var monthly = Math.ceil(remaining / months);
  return {
    monthly: monthly,
    text: 'Put aside about ' + money(monthly) + ' a month for ' + months + (months === 1 ? ' month' : ' months') + ' to reach it by ' + dateLabel(g.targetDate) + '.'
  };
}

function pageGoals() {
  var cards = data.goals.map(function (g) {
    var ratio = g.target > 0 ? g.saved / g.target : 0;
    var plan = goalPlan(g);
    return '<section class="card" aria-labelledby="goal-' + esc(g.id) + '"><div class="card-head"><h2 id="goal-' + esc(g.id) + '">' + esc(g.name) + '</h2>' +
      '<span class="pill ' + (plan.done ? 'good' : plan.late ? 'bad' : 'neutral') + '">' + esc(percent(Math.min(1, ratio))) + '</span></div>' +
      '<div class="stat" style="padding:0"><div class="value">' + esc(money(g.saved)) + ' <span class="muted small">of ' + esc(money(g.target)) + '</span></div></div>' +
      '<div class="bar' + (plan.done ? ' done' : '') + '" style="margin:12px 0" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(clamp(ratio, 0, 1) * 100) + '" aria-label="Progress towards ' + esc(g.name) + '">' +
      '<span style="width:' + clamp(ratio * 100, 0, 100).toFixed(1) + '%"></span></div>' +
      '<p class="small' + (plan.late ? ' bad' : ' muted') + '">' + esc(plan.text) + '</p>' +
      '<div class="row"><button type="button" class="btn small primary" data-action="goal-money" data-id="' + esc(g.id) + '">' + icon('plus', 16) + 'Add or take out money</button>' +
      '<span class="spacer"></span>' +
      '<button type="button" class="icon-btn" data-action="goal-edit" data-id="' + esc(g.id) + '" aria-label="Edit ' + esc(g.name) + '">' + icon('edit', 18) + '</button>' +
      '<button type="button" class="icon-btn" data-action="goal-delete" data-id="' + esc(g.id) + '" aria-label="Delete ' + esc(g.name) + '">' + icon('trash', 18) + '</button></div></section>';
  }).join('');
  var totalSaved = data.goals.reduce(function (s, g) { return s + g.saved; }, 0);
  var totalMonthly = data.goals.reduce(function (s, g) { return s + goalPlan(g).monthly; }, 0);
  var summary = data.goals.length ? '<div class="grid grid-2">' + statCard('Saved across all goals', totalSaved, 'var(--good)') +
    statCard('Needed each month to stay on track', totalMonthly, 'var(--accent)') + '</div>' : '';
  var addForm = '<section class="card mt" aria-labelledby="goalAddH"><div class="card-head"><h2 id="goalAddH">Add a savings goal</h2></div>' +
    '<form data-form="goal-add" data-draft="goalAdd" novalidate><div class="form-grid">' + goalFormFields('ga', {}) +
    '<button type="submit" class="btn primary">' + icon('plus', 18) + 'Add goal</button></div><p class="error-msg" id="gaErr" role="alert"></p></form></section>';
  return pageHead('Savings goals', 'Save towards the things that matter to you.') + summary +
    (data.goals.length ? '<div class="grid grid-2 mt">' + cards + '</div>' :
      '<section class="card">' + emptyState('No goals yet', ' Add something you are saving for, like a holiday or a rainy-day fund.') + '</section>') + addForm;
}

/* ----- Debt payoff ----- */
function debtFormFields(idp, v) {
  return '<label class="field"><span>Name</span><input class="input" id="' + idp + 'Name" name="name" maxlength="60" autocomplete="off" value="' + esc(v.name || '') + '" placeholder="For example, Credit card"></label>' +
    '<label class="field"><span>Amount owed</span><input class="input money" id="' + idp + 'Balance" name="balance" inputmode="decimal" autocomplete="off" value="' + esc(v.balance || '') + '" placeholder="0"></label>' +
    '<label class="field"><span>Interest rate (% a year)</span><input class="input" id="' + idp + 'Rate" name="rate" inputmode="decimal" autocomplete="off" value="' + esc(v.rate || '') + '" placeholder="For example, 19.9"></label>' +
    '<label class="field"><span>Minimum payment a month</span><input class="input money" id="' + idp + 'Min" name="minPayment" inputmode="decimal" autocomplete="off" value="' + esc(v.minPayment || '') + '" placeholder="0"></label>';
}

function rateText(rate) { return numberText(rate, 2) + '%'; }
function rateInput(rate) { var s = String(rate); return localeDecimal() === ',' ? s.replace('.', ',') : s; }

function payoffLabel(months) { return monthsFromNowLabel(months); }
function durationLabel(months) {
  var y = Math.floor(months / 12), mo = months % 12;
  var parts = [];
  if (y) parts.push(y + (y === 1 ? ' year' : ' years'));
  if (mo || !y) parts.push(mo + (mo === 1 ? ' month' : ' months'));
  return parts.join(' and ');
}

function pageDebts() {
  var debts = data.debts.filter(function (d) { return d.balance > 0; });
  var totalOwed = debts.reduce(function (s, d) { return s + d.balance; }, 0);
  var totalMin = debts.reduce(function (s, d) { return s + d.minPayment; }, 0);

  var list = !data.debts.length ? emptyState('No debts added', ' Add each card or loan to see the quickest and cheapest way to pay them off.') :
    '<ul class="list wrap-sm">' + data.debts.map(function (d) {
      var monthlyInterest = Math.round(d.balance * d.rate / 100 / 12);
      var warn = d.balance > 0 && d.minPayment <= monthlyInterest ?
        '<div class="li-sub bad">The minimum payment does not cover the ' + esc(money(monthlyInterest)) + ' of interest added each month.</div>' : '';
      return '<li>' + badge(initials(d.name), 'var(--accent)') +
        '<div class="li-main"><div class="li-title">' + esc(d.name) + '</div><div class="li-sub">Interest ' + esc(rateText(d.rate)) + ' a year, minimum ' + esc(money(d.minPayment)) + ' a month</div>' + warn + '</div>' +
        '<span class="li-amount">' + esc(money(d.balance)) + '</span>' +
        '<button type="button" class="icon-btn" data-action="debt-edit" data-id="' + esc(d.id) + '" aria-label="Edit ' + esc(d.name) + '">' + icon('edit', 18) + '</button>' +
        '<button type="button" class="icon-btn" data-action="debt-delete" data-id="' + esc(d.id) + '" aria-label="Delete ' + esc(d.name) + '">' + icon('trash', 18) + '</button></li>';
    }).join('') + '</ul>';

  var extraCard = '<section class="card" aria-labelledby="extraH"><div class="card-head"><h2 id="extraH">Extra payment each month</h2></div>' +
    '<p class="muted small">Money you can pay on top of the minimums. When a debt is cleared, its minimum rolls over to the next one.</p>' +
    '<label class="field"><span>Extra amount a month</span><input class="input money" id="debtExtra" data-debt-extra inputmode="decimal" autocomplete="off" value="' + esc(data.debtExtra ? centsToInput(data.debtExtra) : '') + '" placeholder="0"></label>' +
    '<dl class="kv"><dt>Total owed</dt><dd>' + esc(money(totalOwed)) + '</dd><dt>Paid each month</dt><dd>' + esc(money(totalMin + data.debtExtra)) + '</dd></dl></section>';

  var addForm = '<section class="card" aria-labelledby="debtAddH"><div class="card-head"><h2 id="debtAddH">Add a debt</h2></div>' +
    '<form data-form="debt-add" data-draft="debtAdd" novalidate><div class="stack">' + debtFormFields('da', {}) +
    '<button type="submit" class="btn primary">' + icon('plus', 18) + 'Add debt</button></div><p class="error-msg" id="daErr" role="alert"></p></form></section>';

  var compare = '';
  if (debts.length) {
    var snow = simulateDebts(debts, data.debtExtra, 'snowball');
    var aval = simulateDebts(debts, data.debtExtra, 'avalanche');
    var base = simulateDebts(debts, 0, 'minimum');
    var best = '';
    if (snow.finished && aval.finished) {
      if (aval.totalInterest < snow.totalInterest) best = 'avalanche';
      else if (snow.totalInterest < aval.totalInterest) best = 'snowball';
    }
    var stratCard = function (key, title, desc, r) {
      var saved;
      if (!r.finished) saved = '—';
      else if (base.finished) saved = money(Math.max(0, base.totalInterest - r.totalInterest));
      else saved = 'More than ' + money(Math.max(0, base.totalInterest - r.totalInterest));
      return '<section class="card strategy-card' + (best === key ? ' best' : '') + '" aria-labelledby="st-' + key + '">' +
        '<div class="card-head"><h2 id="st-' + key + '">' + title + '</h2>' + (best === key ? '<span class="pill good">Costs the least</span>' : '') + '</div>' +
        '<p class="muted small">' + desc + '</p>' +
        (r.finished ?
          '<dl class="kv"><dt>Debt-free by</dt><dd>' + esc(payoffLabel(r.months)) + '</dd>' +
          '<dt>Time to pay off</dt><dd>' + esc(durationLabel(r.months)) + '</dd>' +
          '<dt>Total interest</dt><dd>' + esc(money(r.totalInterest)) + '</dd>' +
          '<dt>Interest saved</dt><dd class="good">' + esc(saved) + '</dd></dl>' :
          '<p class="bad">At this rate the debts would not be paid off within 50 years. Try a bigger extra payment.</p>') + '</section>';
    };
    var sameNote = (!best && snow.finished && aval.finished) ? '<p class="small muted mt">Both methods cost the same here, so pick the one that keeps you motivated.</p>' : '';
    var chosen = ui.debtStrategy === 'snowball' ? snow : aval;
    var order = '<section class="card mt" aria-labelledby="orderH"><div class="card-head"><h2 id="orderH">Payoff order</h2>' +
      '<div class="seg" role="group" aria-label="Method">' +
      '<button type="button" data-action="debt-strategy" data-value="snowball" aria-pressed="' + (ui.debtStrategy === 'snowball') + '">Snowball</button>' +
      '<button type="button" data-action="debt-strategy" data-value="avalanche" aria-pressed="' + (ui.debtStrategy === 'avalanche') + '">Avalanche</button></div></div>' +
      '<ol class="list">' + chosen.order.map(function (o, i) {
        return '<li>' + badge(String(i + 1), 'var(--accent)') + '<div class="li-main"><div class="li-title">' + esc(o.name) + '</div></div>' +
          '<span class="li-sub">' + (o.paidMonth ? 'Paid off by ' + esc(payoffLabel(o.paidMonth)) : 'Not paid off within 50 years') + '</span></li>';
      }).join('') + '</ol></section>';
    var series = [{ name: 'Snowball', color: 'var(--accent)' }, { name: 'Avalanche', color: 'var(--spend)' }];
    var chart = '<section class="card mt" aria-labelledby="debtChartH"><div class="card-head"><h2 id="debtChartH">How your balance falls</h2>' +
      '<p class="muted small">Total owed each month</p></div>' +
      linesSvg([{ name: 'Snowball', color: 'var(--accent)', values: snow.series }, { name: 'Avalanche', color: 'var(--spend)', values: aval.series, dashed: true }],
        'Total owed over time. Snowball: debt-free in ' + durationLabel(snow.months) + '. Avalanche: debt-free in ' + durationLabel(aval.months) + '.') +
      legend(series) + '</section>';
    compare = '<div class="grid grid-2 mt">' +
      stratCard('snowball', 'Snowball', 'Pay off the smallest balance first. You clear whole debts sooner, which can keep you motivated.', snow) +
      stratCard('avalanche', 'Avalanche', 'Pay off the highest interest rate first. This usually costs the least in interest.', aval) + '</div>' +
      sameNote + chart + order +
      '<p class="small muted mt">Interest saved is compared with paying only the minimums. Dates assume your first payment is next month and rates stay the same. This is an estimate, not financial advice.</p>';
  }

  return pageHead('Debt payoff', 'See when you could be debt-free and how much interest you could save.') +
    '<section class="card" aria-labelledby="debtsH"><div class="card-head"><h2 id="debtsH">Your debts</h2></div>' + list + '</section>' +
    '<div class="grid grid-2 mt">' + extraCard + addForm + '</div>' + compare;
}

/* ----- Year summary ----- */
function pageYear() {
  var y = ui.year;
  var now = thisMonth();
  var months = [];
  var inc = 0, out = 0;
  for (var i = 0; i < 12; i++) {
    var key = y + '-' + pad2(i + 1);
    var t = { income: 0, spent: 0 };
    txInMonth(key).forEach(function (x) { if (x.type === 'income') t.income += x.amount; else t.spent += x.amount; });
    inc += t.income; out += t.spent;
    months.push({ key: key, i: i, income: t.income, spent: t.spent });
  }
  var tools = '<div class="yr-switch"><button type="button" class="icon-btn" data-action="year-step" data-delta="-1" aria-label="Previous year">' + icon('chevL') + '</button>' +
    '<strong aria-live="polite">' + y + '</strong><button type="button" class="icon-btn" data-action="year-step" data-delta="1" aria-label="Next year">' + icon('chevR') + '</button></div>';
  var rate = inc > 0 ? (inc - out) / inc : 0;
  var stats = '<div class="grid grid-4">' + statCard('Income', inc, 'var(--income)') + statCard('Spent', out, 'var(--spend)') +
    statCard('Left over', inc - out, 'var(--accent)', inc - out < 0 ? 'bad' : '') +
    '<div class="card stat"><div class="label"><span class="dot" style="background:var(--good)"></span>Share of income kept</div><div class="value">' + esc(percent(rate)) + '</div></div></div>';
  var series = [{ name: 'Income', color: 'var(--income)' }, { name: 'Spending', color: 'var(--spend)' }];
  var groups = months.map(function (mm) { return { label: monthName(mm.i, isNarrow() ? 'narrow' : 'short'), a: mm.income, b: mm.spent }; });
  var hi = Number(now.slice(0, 4)) === y ? Number(now.slice(5, 7)) - 1 : -1;
  var chart = '<section class="card mt" aria-labelledby="yrChartH"><div class="card-head"><h2 id="yrChartH">Month by month</h2></div>' +
    barsSvg(groups, series, 'Income and spending in ' + y + ': ' + months.map(function (mm) { return monthName(mm.i, 'long') + ' income ' + money(mm.income) + ', spending ' + money(mm.spent); }).join('; '), hi) +
    legend(series) + '</section>';
  var grid = '<div class="year-grid mt">' + months.map(function (mm) {
    var left = mm.income - mm.spent;
    var ratio = mm.income > 0 ? mm.spent / mm.income : (mm.spent > 0 ? 1 : 0);
    return '<button type="button" class="month-card' + (mm.key > now ? ' future' : '') + '" data-action="open-month" data-month="' + mm.key + '" aria-label="' +
      esc(monthLabel(mm.key) + ': income ' + money(mm.income) + ', spent ' + money(mm.spent) + ', left ' + money(left) + '. Open overview') + '">' +
      '<strong>' + esc(monthName(mm.i, 'long')) + '</strong>' +
      '<span class="mc-row"><span class="muted">In</span><span>' + esc(money(mm.income)) + '</span></span>' +
      '<span class="mc-row"><span class="muted">Out</span><span>' + esc(money(mm.spent)) + '</span></span>' +
      '<span class="mc-row"><span class="muted">Left</span><span class="' + (left < 0 ? 'bad' : left > 0 ? 'good' : '') + '">' + esc(money(left)) + '</span></span>' +
      '<span class="bar' + (ratio > 1 ? ' over' : '') + '" aria-hidden="true"><span style="width:' + clamp(ratio * 100, 0, 100).toFixed(1) + '%"></span></span></button>';
  }).join('') + '</div>';
  return pageHead('Year summary', 'Twelve months at a glance. Choose a month to open it.', tools) + stats + chart + grid;
}

    '<button type="button" class="btn" data-action="csv-import">' + icon('upload', 18) + 'Import edited file</button></div>' +
    '<p class="small muted mt">Importing replaces what is in the planner now. You will be asked first, and a snapshot is taken so you can undo it.</p></section>';

  var reset = '<section class="card" aria-labelledby="setResetH"><div class="card-head"><h2 id="setResetH">Start over</h2></div>' +
    '<ul class="list wrap-sm">' +
    '<li><div class="li-main"><div class="li-title">Load sample data</div><div class="li-sub">Replace everything with example money to explore the planner.</div></div><button type="button" class="btn small" data-action="sample-load">Load sample</button></li>' +
    '<li><div class="li-main"><div class="li-title">Clear entries</div><div class="li-sub">Remove transactions, bills, goals, debts, milestones, planner entries and monthly plans. Keeps your categories, budget amounts, envelopes and settings.</div></div><button type="button" class="btn small danger" data-action="clear-entries">Clear entries</button></li>' +
    '<li><div class="li-main"><div class="li-title">Reset everything</div><div class="li-sub">Go back to a blank planner with the starting categories and settings.</div></div><button type="button" class="btn small danger" data-action="reset-all">Reset</button></li>' +
    '</ul><p class="small muted mt">A snapshot is taken first each time, so you can restore it from the list above.</p></section>';

  return pageHead('Settings', 'Make the planner yours, and keep your data safe.') +
    '<div class="stack">' + details + region + look + backups + auto + snaps + reminder + csv + storage + reset + '</div>';
}

/* ----- Help ----- */
function pageHelp() {
  var faqs = [
    ['Where is my information kept?', 'Only on this device, inside the browser you opened the planner with. Nothing is sent anywhere, and there is no account. If you open the planner in a different browser or on another device, it starts empty until you restore a backup file there.'],
    ['How do I move to another computer or phone?', 'Go to Settings and press Save backup. Copy the backup file and this planner file to the other device, open the planner there, then choose Restore from a backup file.'],
    ['What does “Safe to spend today” mean?', 'It takes this month’s income, subtracts what you have already spent and the bills you have not paid yet, and shares what is left over the days remaining in the month. It is an estimate to guide you, not financial advice.'],
    ['What happens if I clear my browser history?', 'Clearing “site data” or “cookies and site data” can remove the planner’s saved data. The planner keeps a second copy and will try to recover from it, but the safest protection is a recent backup file.'],
    ['What are snapshots?', 'Automatic copies kept inside this browser. One is taken when you leave the page, switch tabs, save a backup or before something that replaces data. Find them in Settings and press Restore to go back.'],
    ['How do I edit my data in a spreadsheet?', 'In Settings, press Download editable file. Open it in Excel, Google Sheets or Numbers, make your changes and save it as CSV. Then press Import edited file. Keep the first row and the “Record” column as they are.'],
    ['The editable file opens with everything in one column', 'Some spreadsheet apps expect semicolons instead of commas. In Excel, use Data, then From Text/CSV, and choose comma as the separator. The planner can read files saved with either commas or semicolons.'],
    ['What is the difference between snowball and avalanche?', 'Both pay the minimum on every debt and put any extra money towards one debt at a time. Snowball starts with the smallest balance. Avalanche starts with the highest interest rate, which usually saves more money.'],
    ['How do I mark a bill as paid?', 'On the Bills page, press Paid next to the bill. A matching transaction is added for that month. Press Not paid to remove it again.'],
    ['Can I undo a mistake?', 'Yes. After deleting or changing something, press Undo in the message at the bottom of the screen. For bigger mistakes, restore a snapshot in Settings.'],
    ['Why is the automatic backup file not available?', 'It uses a feature that only Chrome and Edge on a computer offer. In other browsers, press Save backup from time to time instead.'],
    ['Why does Ctrl+N open a new window?',  'Your browser reserves Ctrl+N for itself, so the planner never even sees the key in a normal tab. Use Alt+N, or switch on full screen with the button in the sidebar (Chrome and Edge), where Ctrl+N opens Quick add.'],
    ['What keyboard shortcuts are there?', 'Alt+N opens Quick add at any time. Browsers keep Ctrl+N for opening a new window and do not let web pages use it, so Ctrl+N only opens Quick add in full screen: in Chrome or Edge, press “Full screen, use Ctrl+N” in the sidebar, and press Esc to leave. Press ? to open the help for the page you are on.'],
    ['What do the ? buttons do?', 'Every page title and section has a small ? button. Press it for a short introduction to that part of the planner and how to use it.'],
    ['What is the difference between Budget and Envelopes?', 'Budget sets an amount for each single category. An envelope is a pot of money that can cover several categories, such as Food for both groceries and eating out. Envelopes also suggest how to adjust your spending and let you move money between pots for the month.'],
    ['How do milestones work?', 'Every savings goal automatically gets checkpoints at 25%, 50%, 75% and 100%. You can add your own milestones too. Link one to a goal with an amount and it is reached by itself, or leave it unlinked and tick it off when it is done.'],
    ['Will the planner remind me on my phone?', 'No. The planner works offline in your browser, so it cannot send notifications. Reminders and to-dos appear in the Planner and in “Month at a glance” on the Overview, with overdue ones highlighted.'],
    ['What is the Monthly summary for?', 'Set a plan at the start of each month (income, savings target, spending limit), then see how the month really went, write a short review and compare the last 12 months.'],
    ['I opened two copies of the planner file', 'Some browsers share saved data between copies of the file, while others keep them separate. To avoid confusion, keep one copy of the planner in one place and use backup files to move data.']
  ];
  return pageHead('Help', 'Short answers to common questions.') + '<section class="card">' + faqs.map(function (f) {
    return '<details class="faq"><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>';
  }).join('') + '</section>' +
    '<p class="small muted mt">Budget Planner works offline and never connects to the internet. Your figures are your own.</p>';
}

/* ---------- 6b. Greeting, month at a glance, and the new pages ---------- */

function isTyping(el) {
  return !!el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
}
function anyDialogOpen() {
  return ['#dlg', '#confirmDlg', '#tipDlg'].some(function (s) { var d = $(s); return d && d.open; });
}

/* ----- Greeting and clock ----- */
function greetingFor(h) {
  if (h >= 5 && h < 12) return 'Good morning';
  if (h >= 12 && h < 17) return 'Good afternoon';
  return 'Good evening';
}
function greetingIcon(h) { return h >= 5 && h < 12 ? 'sunrise' : h >= 12 && h < 17 ? 'sun' : 'moon'; }
function greetingText() {
  var n = data.settings.name;
  return greetingFor(new Date().getHours()) + (n ? ', ' + n : '');
}
function todayLineInner() {
  var d = new Date();
  return icon(greetingIcon(d.getHours()), 18) +
    '<span>' + esc(dateFmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d)) + '</span>' +
    '<span aria-hidden="true">·</span><span class="clock">' + esc(dateFmt({ hour: 'numeric', minute: '2-digit' }).format(d)) + '</span>';
}
function todayLineHtml() { return '<p class="greet-date" id="todayLine">' + todayLineInner() + '</p>'; }

var clockDay = '';
function tickClock() {
  if (!data || !ui) return;
  var today = todayStr();
  if (clockDay && today !== clockDay) {
    // A new day started while the planner was open: redraw so every figure uses the new date.
    clockDay = today;
    if (!anyDialogOpen() && !monthPickerOpen && !isTyping(document.activeElement)) render();
    return;
  }
  clockDay = today;
  if (ui.page !== 'overview') return;
  var line = $('#todayLine');
  if (line) line.innerHTML = todayLineInner();
  var h = $('#pageTitle');
  if (h) h.textContent = greetingText();
}

/* ----- Shared month figures ----- */
function monthPassFrac(m) {
  var now = thisMonth();
  if (m < now) return 1;
  if (m > now) return 0;
  return new Date().getDate() / daysInMonth(m);
}
function plannedSpending() {
  return categoriesOf('expense').reduce(function (s, c) { return s + c.budget; }, 0);
}
function monthStats(m) {
  var now = thisMonth();
  var dim = daysInMonth(m);
  var st = {
    month: m, dim: dim, passed: m < now ? dim : m > now ? 0 : new Date().getDate(),
    income: 0, spent: 0, savings: 0, nonBill: 0, count: 0, biggest: null, byDay: {}, topCat: null,
    billsTotal: data.bills.length, billsPaid: 0
  };
  txInMonth(m).forEach(function (t) {
    if (t.type === 'income') { st.income += t.amount; return; }
    st.spent += t.amount;
    st.count++;
    st.byDay[t.date] = (st.byDay[t.date] || 0) + t.amount;
    if (t.categoryId === 'c-saving') { st.savings += t.amount; return; }
    if (!t.billId) st.nonBill += t.amount;
    if (!st.biggest || t.amount > st.biggest.amount) st.biggest = t;
  });
  var by = spendingByCategory(m);
  Object.keys(by).forEach(function (id) {
    if (id === 'c-saving') return;
    if (!st.topCat || by[id] > st.topCat.amount) st.topCat = { id: id, amount: by[id] };
  });
  data.bills.forEach(function (b) { if (billPayment(b, m)) st.billsPaid++; });
  return st;
}
function spentUpToDay(m, day) {
  return data.transactions.reduce(function (s, t) {
    return t.type === 'expense' && t.date.slice(0, 7) === m && Number(t.date.slice(8, 10)) <= day ? s + t.amount : s;
  }, 0);
}
function plannerItemsOn(date) {
  return data.plannerItems.filter(function (p) { return p.date === date; }).sort(function (a, b) {
    return (b.important - a.important) || ((a.time || '99') < (b.time || '99') ? -1 : (a.time || '99') > (b.time || '99') ? 1 : 0) || a.title.localeCompare(b.title);
  });
}
function miniCard(label, value, foot, cls) {
  return '<div class="mini"><div class="label">' + esc(label) + '</div><div class="value ' + (cls || '') + '">' + esc(value) + '</div>' +
    (foot ? '<div class="foot">' + esc(foot) + '</div>' : '') + '</div>';
}
function paceBar(usedFrac, passFrac, color, label) {
  var over = usedFrac > 1;
  return '<div class="pace" role="img" aria-label="' + esc(label) + '"><div class="bar' + (over ? ' over' : '') + '"><span style="width:' +
    (clamp(usedFrac, 0, 1) * 100).toFixed(1) + '%' + (over ? '' : ';background:' + (color || 'var(--accent)')) + '"></span></div>' +
    (passFrac > 0 && passFrac < 1 ? '<span class="pace-mark" style="left:' + (passFrac * 100).toFixed(1) + '%" title="Today"></span>' : '') + '</div>';
}

/* ----- Overview: this month at a glance ----- */
function overviewGlance(m) {
  var now = thisMonth();
  var st = monthStats(m);
  var prev = addMonths(m, -1);
  var passFrac = monthPassFrac(m);
  var planned = plannedSpending();
  var usedFrac = planned > 0 ? st.spent / planned : 0;
  var mName = monthName(Number(m.slice(5, 7)) - 1, 'long');
  var billsDue = monthTotals(m).billsDue;
  var summary;
  if (m > now) {
    summary = mName + ' has not started yet. ' + (billsDue ? money(billsDue) + ' of bills are already expected.' : 'Nothing is planned for it yet.');
  } else if (m < now) {
    summary = mName + ' is over. You spent ' + money(st.spent) + (planned ? ', which is ' + percent(usedFrac) + ' of your ' + money(planned) + ' plan. ' +
      (usedFrac > 1 ? 'You went over by ' + money(st.spent - planned) + '.' : 'You stayed inside your plan.') : '.');
  } else if (!planned) {
    summary = percent(passFrac) + ' of ' + mName + ' has gone and you have spent ' + money(st.spent) + '. Set a budget to see whether that is on pace.';
  } else {
    summary = percent(passFrac) + ' of ' + mName + ' has gone and you have used ' + percent(usedFrac) + ' of your spending plan. ' +
      (usedFrac > passFrac + 0.1 ? 'You are spending faster than the month is passing, so try to slow down a little.' :
        usedFrac < passFrac - 0.1 ? 'You are spending slower than the month is passing. Nice work.' : 'Your spending is about on pace with the month.');
  }

  var minis;
  var sameDay = m === now ? st.passed : 31;
  var prevSame = spentUpToDay(prev, sameDay);
  var diff = st.spent - prevSame;
  var prevName = monthName(Number(prev.slice(5, 7)) - 1, 'long');
  var avg = st.passed > 0 ? Math.round(st.spent / st.passed) : 0;
  var projected = st.spent;
  if (m === now) projected = st.spent + billsDue + Math.round(st.nonBill / Math.max(1, st.passed) * (st.dim - st.passed));
  if (m > now) projected = billsDue;
  minis = '<div class="grid grid-4">' +
    miniCard(m > now ? 'Spent' : 'Spent so far', money(st.spent), st.count + (st.count === 1 ? ' payment' : ' payments')) +
    miniCard('Average a day', money(avg), st.passed ? 'over ' + st.passed + (st.passed === 1 ? ' day' : ' days') : 'no days yet') +
    miniCard(m < now ? 'Total for the month' : 'Likely by month end', money(projected), m < now ? 'final figure' : 'includes bills still due') +
    miniCard('Compared with ' + prevName, (diff > 0 ? '+' : diff < 0 ? '−' : '') + money(Math.abs(diff)), m === now ? 'at the same point last month' : 'whole month',
      diff > 0 ? 'bad' : diff < 0 ? 'good' : '') + '</div>';

  var pace = planned ? '<div class="mt">' + paceBar(usedFrac, m === now ? passFrac : 0, 'var(--accent)', percent(usedFrac) + ' of the spending plan used, ' + percent(passFrac) + ' of the month gone') +
    '<div class="pace-legend"><span>Spending plan used: <strong>' + esc(percent(usedFrac)) + '</strong> (' + esc(money(st.spent)) + ' of ' + esc(money(planned)) + ')</span>' +
    (m === now ? '<span>Month gone: <strong>' + esc(percent(passFrac)) + '</strong> (the dark line)</span>' : '') + '</div></div>' : '';

  var todays = m === now ? plannerItemsOn(todayStr()).filter(function (p) { return !p.done; }) : [];
  var rows = [];
  rows.push('<li><div class="li-main"><div class="li-title">Top category</div><div class="li-sub">' + (st.topCat ? esc(catName(st.topCat.id)) : 'No spending yet') + '</div></div>' +
    (st.topCat ? '<span class="li-amount">' + esc(money(st.topCat.amount)) + '</span>' : '') + '</li>');
  rows.push('<li><div class="li-main"><div class="li-title">Biggest single expense</div><div class="li-sub">' +
    (st.biggest ? esc((st.biggest.note || catName(st.biggest.categoryId)) + ', ' + dateLabel(st.biggest.date, { day: 'numeric', month: 'short' })) : 'None yet') + '</div></div>' +
    (st.biggest ? '<span class="li-amount">' + esc(money(st.biggest.amount)) + '</span>' : '') + '</li>');
  rows.push('<li><div class="li-main"><div class="li-title">Bills paid</div><div class="li-sub">' + st.billsPaid + ' of ' + st.billsTotal + '</div></div>' +
    '<span class="li-amount">' + esc(money(billsDue)) + ' due</span></li>');
  if (m === now) {
    rows.push('<li><div class="li-main"><div class="li-title">In your planner today</div><div class="li-sub">' +
      (todays.length ? esc(todays.slice(0, 2).map(function (p) { return p.title; }).join(', ') + (todays.length > 2 ? ' and ' + (todays.length - 2) + ' more' : '')) : 'Nothing planned for today') +
      '</div></div><button type="button" class="btn ghost small" data-action="nav" data-page="planner">Open planner</button></li>');
  }

  return '<section class="card mt" aria-labelledby="glanceH"><div class="card-head"><h2 id="glanceH">' + esc(monthLabel(m)) + ' at a glance</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="summary">Full monthly summary</button></div>' +
    '<p class="glance-summary">' + esc(summary) + '</p>' + minis + pace +
    '<ul class="list mt">' + rows.join('') + '</ul></section>';
}

/* ----- Milestones ----- */
var STEP_FRACTIONS = [0.25, 0.5, 0.75, 1];

function milestoneInfo(ms) {
  var g = ms.goalId ? findById(data.goals, ms.goalId) : null;
  var reached = g ? g.saved >= ms.amount : !!ms.done;
  var progress = g ? (ms.amount > 0 ? g.saved / ms.amount : 0) : (reached ? 1 : 0);
  var today = todayStr();
  var st;
  if (reached) st = { cls: 'good', label: 'Reached' };
  else if (ms.dueDate && ms.dueDate < today) st = { cls: 'bad', label: 'Overdue' };
  else if (ms.dueDate && dayDiff(today, ms.dueDate) <= 14) st = { cls: 'warn', label: 'Due soon' };
  else st = { cls: 'neutral', label: 'In progress' };
  return { goal: g, reached: reached, progress: progress, status: st };
}

/** Estimated month a goal reaches an amount, using its monthly plan. */
function goalEta(g, amount) {
  if (g.saved >= amount) return '';
  var monthly = goalPlan(g).monthly;
  if (!monthly) return '';
  return monthsFromNowLabel(Math.max(1, Math.ceil((amount - g.saved) / monthly)));
}

function pageMilestones() {
  var custom = data.milestones.slice().sort(function (a, b) {
    var ia = milestoneInfo(a), ib = milestoneInfo(b);
    return (ia.reached - ib.reached) || ((a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : (a.dueDate || '9999') > (b.dueDate || '9999') ? 1 : 0);
  });
  var reachedCustom = 0, stepsReached = 0, stepsTotal = 0;
  custom.forEach(function (ms) { if (milestoneInfo(ms).reached) reachedCustom++; });
  data.goals.forEach(function (g) {
    STEP_FRACTIONS.forEach(function (f) { stepsTotal++; if (g.saved >= Math.ceil(g.target * f)) stepsReached++; });
  });

  // Coming up: custom milestones not reached, plus each goal's next step.
  var upcoming = [];
  custom.forEach(function (ms) {
    var info = milestoneInfo(ms);
    if (!info.reached) upcoming.push({ title: ms.title, sub: (info.goal ? info.goal.name + ', ' + money(ms.amount) : 'Ticked off by you') + (ms.dueDate ? ', by ' + dateLabel(ms.dueDate) : ''), sort: ms.dueDate || '9998', status: info.status });
  });
  data.goals.forEach(function (g) {
    for (var i = 0; i < STEP_FRACTIONS.length; i++) {
      var amt = Math.ceil(g.target * STEP_FRACTIONS[i]);
      if (g.saved < amt) {
        var eta = goalEta(g, amt);
        upcoming.push({ title: g.name + ': ' + percent(STEP_FRACTIONS[i]) + ' saved', sub: money(amt - g.saved) + ' to go' + (eta ? ', around ' + eta : ''), sort: eta ? addMonths(thisMonth(), Math.ceil((amt - g.saved) / Math.max(1, goalPlan(g).monthly))) + '-28' : '9999', status: { cls: 'neutral', label: 'Next step' } });
        break;
      }
    }
  });
  upcoming.sort(function (a, b) { return a.sort < b.sort ? -1 : a.sort > b.sort ? 1 : 0; });
  var next = upcoming[0];

  var stats = '<div class="grid grid-3">' +
    '<div class="card stat"><div class="label"><span class="dot" style="background:var(--good)"></span>Milestones reached</div><div class="value">' + (reachedCustom + stepsReached) + ' <span class="muted small">of ' + (custom.length + stepsTotal) + '</span></div></div>' +
    '<div class="card stat"><div class="label"><span class="dot" style="background:var(--accent)"></span>Next milestone</div><div class="value" style="font-size:1.0625rem">' + esc(next ? next.title : 'All reached') + '</div></div>' +
    '<div class="card stat"><div class="label"><span class="dot" style="background:var(--warn)"></span>Goals fully funded</div><div class="value">' +
    data.goals.filter(function (g) { return g.saved >= g.target; }).length + ' <span class="muted small">of ' + data.goals.length + '</span></div></div></div>';

  var upCard = '<section class="card" aria-labelledby="msNextH"><div class="card-head"><h2 id="msNextH">Coming up next</h2></div>' +
    (upcoming.length ? '<ul class="list">' + upcoming.slice(0, 6).map(function (u) {
      return '<li>' + badge('', 'var(--accent)').replace('></span>', '>' + icon('flag', 18) + '</span>') +
        '<div class="li-main"><div class="li-title">' + esc(u.title) + '</div><div class="li-sub">' + esc(u.sub) + '</div></div><span class="pill ' + u.status.cls + '">' + esc(u.status.label) + '</span></li>';
    }).join('') + '</ul>' : emptyState('Nothing waiting', ' Every milestone has been reached. Add a new one below.')) + '</section>';

  var goalCard = '<section class="card" aria-labelledby="msGoalsH"><div class="card-head"><h2 id="msGoalsH">Goal checkpoints</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="goals">Savings goals</button></div>' +
    (data.goals.length ? data.goals.map(function (g, gi) {
      var nextShown = false;
      return '<div' + (gi ? ' class="mt"' : '') + '><div class="row"><strong>' + esc(g.name) + '</strong><span class="spacer"></span><span class="small muted">' + esc(money(g.saved)) + ' of ' + esc(money(g.target)) + '</span></div>' +
        '<div class="steps">' + STEP_FRACTIONS.map(function (f) {
          var amt = Math.ceil(g.target * f);
          var done = g.saved >= amt;
          var isNext = !done && !nextShown;
          if (isNext) nextShown = true;
          var eta = isNext ? goalEta(g, amt) : '';
          return '<div class="step' + (done ? ' done' : isNext ? ' next' : '') + '"><strong>' + (done ? icon('check', 14) : '') + esc(percent(f)) + '</strong>' +
            '<span class="money">' + esc(money(amt)) + '</span><span class="' + (done ? '' : 'muted') + '">' + (done ? 'Reached' : isNext ? (eta ? 'About ' + esc(eta) : money(amt - g.saved) + ' to go') : 'Later') + '</span></div>';
        }).join('') + '</div></div>';
    }).join('') : emptyState('No savings goals yet', ' Add a goal and its 25%, 50%, 75% and 100% checkpoints appear here.',
      '<button type="button" class="btn small" data-action="nav" data-page="goals">Add a goal</button>')) + '</section>';

  var list = custom.length ? '<ul class="list wrap-sm">' + custom.map(function (ms) {
    var info = milestoneInfo(ms);
    var toggle = ms.goalId ? badge('', info.reached ? 'var(--good)' : 'var(--accent)').replace('></span>', '>' + icon(info.reached ? 'check' : 'goal', 18) + '</span>') :
      '<button type="button" class="toggle-btn" data-action="ms-toggle" data-id="' + esc(ms.id) + '" aria-pressed="' + ms.done + '" aria-label="' + esc((ms.done ? 'Mark not reached: ' : 'Mark reached: ') + ms.title) + '">' + icon('check', 16) + '</button>';
    var sub = info.goal ? 'Linked to ' + info.goal.name + ': ' + money(Math.min(info.goal.saved, ms.amount)) + ' of ' + money(ms.amount) :
      (ms.done ? 'Reached ' + dateLabel(ymd(new Date(ms.doneAt))) : 'Tick it off when it is done');
    if (ms.dueDate) sub += '. Target date ' + dateLabel(ms.dueDate);
    return '<li class="' + (info.reached ? 'is-done' : '') + '">' + toggle +
      '<div class="li-main"><div class="li-title">' + esc(ms.title) + '</div><div class="li-sub">' + esc(sub) + '</div>' +
      (info.goal ? '<div class="bar' + (info.reached ? ' done' : '') + '" style="margin-top:6px" aria-hidden="true"><span style="width:' + (clamp(info.progress, 0, 1) * 100).toFixed(1) + '%"></span></div>' : '') +
      (ms.note ? '<div class="li-sub">' + esc(ms.note) + '</div>' : '') + '</div>' +
      '<span class="pill ' + info.status.cls + '">' + esc(info.status.label) + '</span>' +
      '<button type="button" class="icon-btn" data-action="ms-edit" data-id="' + esc(ms.id) + '" aria-label="Edit ' + esc(ms.title) + '">' + icon('edit', 18) + '</button>' +
      '<button type="button" class="icon-btn" data-action="ms-delete" data-id="' + esc(ms.id) + '" aria-label="Delete ' + esc(ms.title) + '">' + icon('trash', 18) + '</button></li>';
  }).join('') + '</ul>' : emptyState('No milestones yet', ' Add a checkpoint below, such as “Half of my emergency fund” or “Pay off the store card”.');

}

/* ----- Monthly summary ----- */
function planRow(label, actual, target, kind, m) {
  var now = thisMonth();
  var pill, ratio = target > 0 ? actual / target : 0;
  if (!target) pill = '<span class="pill neutral">No target set</span>';
  else if (kind === 'atleast') {
    pill = actual >= target ? '<span class="pill good">Reached</span>' :
      m < now ? '<span class="pill bad">Short by ' + esc(money(target - actual)) + '</span>' : '<span class="pill neutral">' + esc(money(target - actual)) + ' to go</span>';
  } else {
    pill = actual > target ? '<span class="pill bad">Over by ' + esc(money(actual - target)) + '</span>' :
      '<span class="pill good">' + (m < now ? 'Stayed under' : esc(money(target - actual)) + ' left') + '</span>';
  }
  var over = kind === 'atmost' && actual > target;
  return '<li><div class="li-main"><div class="row"><span class="li-title">' + esc(label) + '</span><span class="spacer"></span>' + pill + '</div>' +
    (target ? '<div class="bar' + (over ? ' over' : kind === 'atleast' && actual >= target ? ' done' : '') + '" style="margin:6px 0 4px" aria-hidden="true"><span style="width:' + (clamp(ratio, 0, 1) * 100).toFixed(1) + '%"></span></div>' : '') +
    '<div class="li-sub">' + esc(money(actual)) + (target ? ' of ' + esc(money(target)) : '') + '</div></div></li>';
}

function planVerdict(m) {
  var plan = data.monthPlans[m];
  if (!plan || (!plan.savings && !plan.limit && !plan.income)) return '—';
  if (m >= thisMonth()) return 'In progress';
  var st = monthStats(m);
  var saved = st.savings + Math.max(0, st.income - st.spent);
  var checks = [];
  if (plan.savings) checks.push(saved >= plan.savings);
  if (plan.limit) checks.push(st.spent - st.savings <= plan.limit);
  if (plan.income) checks.push(st.income >= plan.income);
  var met = checks.filter(Boolean).length;
  return met === checks.length ? 'Met' : met ? 'Partly met' : 'Missed';
}

/* ----- Envelopes ----- */
function envFunds(e, m) {
  var f = e.amount;
  data.envelopeMoves.forEach(function (mv) {
    if (mv.month !== m) return;
    if (mv.to === e.id) f += mv.amount;
    if (mv.from === e.id) f -= mv.amount;
  });
  return f;
}
function envSpent(e, by) { return e.categoryIds.reduce(function (s, id) { return s + (by[id] || 0); }, 0); }
function envState(e, m, by) {
  var funds = envFunds(e, m), spent = envSpent(e, by), left = funds - spent;
  var used = funds > 0 ? spent / funds : (spent > 0 ? 2 : 0);
  var pass = monthPassFrac(m), now = thisMonth(), days = daysLeftIn(m);
  var st;
  if (left < 0) st = { cls: 'bad', label: 'Over by ' + money(-left) };
  else if (spent > 0 && left === 0) st = { cls: 'warn', label: 'Empty' };
  else if (m === now && used > pass + 0.1) st = { cls: 'warn', label: 'Spending fast' };
  else if (m < now) st = { cls: 'good', label: 'Stayed inside' };
  else st = { cls: 'good', label: 'On track' };
  return { funds: funds, spent: spent, left: left, used: used, pass: pass, perDay: days > 0 ? Math.floor(Math.max(0, left) / days) : 0, status: st };
}
function envelopeOf(catId) {
  for (var i = 0; i < data.envelopes.length; i++) if (data.envelopes[i].categoryIds.indexOf(catId) >= 0) return data.envelopes[i];
  return null;
}

function envelopeFields(idp, v, editingId) {
  var chosen = {};
  (v.categoryIds || []).forEach(function (id) { chosen[id] = true; });
  var checks = categoriesOf('expense').map(function (c) {
    var owner = envelopeOf(c.id);
    var taken = owner && owner.id !== editingId;
    return '<label class="check' + (taken ? ' disabled' : '') + '"><input type="checkbox" name="cat_' + esc(c.id) + '" value="1"' + (chosen[c.id] ? ' checked' : '') + (taken ? ' disabled' : '') + '>' +
      '<span>' + esc(c.name) + (taken ? ' <span class="muted small">(in ' + esc(owner.name) + ')</span>' : '') + '</span></label>';
  }).join('');
  var colors = PALETTE.slice(0, 10).map(function (col) {
    return '<button type="button" class="swatch" data-action="pick-color" data-value="' + col + '" aria-pressed="' + (v.color === col) + '" aria-label="Colour ' + col + '" style="background:' + col + ';width:30px;height:30px"></button>';
  }).join('');
  return '<div class="form-grid"><label class="field"><span>Envelope name</span><input class="input" id="' + idp + 'Name" name="name" maxlength="40" autocomplete="off" value="' + esc(v.name || '') + '" placeholder="For example, Food"></label>' +
    '<label class="field"><span>Money in it each month</span><input class="input money" id="' + idp + 'Amount" name="amount" inputmode="decimal" autocomplete="off" value="' + esc(v.amount || '') + '" placeholder="0"></label></div>' +
    '<div class="field mt"><span id="' + idp + 'CatL">Spending that comes out of it</span><div class="check-grid" role="group" aria-labelledby="' + idp + 'CatL">' + checks + '</div></div>' +
    '<input type="hidden" name="color" value="' + esc(v.color || PALETTE[data.envelopes.length % PALETTE.length]) + '">' +
    '<div class="field mt"><span id="' + idp + 'ColL">Colour</span><div class="swatches" role="group" aria-labelledby="' + idp + 'ColL">' + colors + '</div></div>';
}

function saveEnvelope(form, id, errId) {
  var v = readForm(form);
  var name = cleanText(v.name, 40);
  if (!name) { showError(form, errId, 'Give the envelope a name.', 'name'); return; }
  var amount = parseMoney(v.amount, localeDecimal());
  if (amount == null || amount < 0) { showError(form, errId, 'Enter how much goes into this envelope each month.', 'amount'); return; }
  var cats = categoriesOf('expense').filter(function (c) {
    var owner = envelopeOf(c.id);
    return v['cat_' + c.id] === '1' && (!owner || owner.id === id);
  }).map(function (c) { return c.id; });
  if (!cats.length) { showError(form, errId, 'Tick at least one kind of spending for this envelope.'); return; }
  var env = { name: name, amount: amount, categoryIds: cats, color: cleanColor(v.color, data.envelopes.length) };
  if (id) {
    commit(function (d) {
      var e = findById(d.envelopes, id);
      if (!e) return false;
      Object.keys(env).forEach(function (k) { e[k] = env[k]; });
    }, { toast: 'Envelope saved.', undo: true });
    closeModal();
  } else {
    env.id = uid('e');
    clearDraft('envAdd');
    commit(function (d) { d.envelopes.push(env); }, { toast: 'Added the “' + name + '” envelope.', undo: true });
  }
}

/** Plain-language suggestions for adjusting spending habits. */
function envelopeTips(m) {
  var tips = [];
  var by = spendingByCategory(m);
  var now = thisMonth();
  data.envelopes.forEach(function (e) {
    var s = envState(e, m, by);
    if (m === now && s.left < 0) {
      tips.push({ cls: 'bad', ico: 'debt', text: e.name + ' is ' + money(-s.left) + ' over. Move money in from an envelope with some left, or pause this spending until next month.' });
    } else if (m === now && s.used > s.pass + 0.1) {
      tips.push({ cls: 'warn', ico: 'bell', text: e.name + ': ' + percent(s.used) + ' used with ' + percent(s.pass) + ' of the month gone. Keep to about ' + money(s.perDay) + ' a day to stay inside it.' });
    }
    // Look back at the three months before this one.
    var total = 0, months = 0, overs = 0;
    for (var i = 1; i <= 3; i++) {
      var key = addMonths(m, -i);
      var b2 = spendingByCategory(key);
      var sp = envSpent(e, b2);
      if (!txInMonth(key).length) continue;
      months++;
      total += sp;
      if (sp > envFunds(e, key)) overs++;
    }
    if (months >= 2 && e.amount > 0) {
      var avg = Math.round(total / months);
      var suggest = Math.ceil(avg / 1000) * 1000;
      if (overs >= 2) tips.push({ cls: 'warn', ico: 'arrows', text: e.name + ' went over in ' + overs + ' of the last ' + months + ' months (about ' + money(avg) + ' a month). Raise it to ' + money(suggest) + ', or pick one habit here to cut back on.' });
      else if (avg < e.amount * 0.75 && suggest < e.amount) tips.push({ cls: 'good', ico: 'bulb', text: e.name + ' usually needs only about ' + money(avg) + '. You could lower it to ' + money(suggest) + ' and send the ' + money(e.amount - suggest) + ' to a savings goal.' });
    }
  });
  var loose = {}, looseSum = 0;
  Object.keys(by).forEach(function (id) {
    if (id === 'c-saving' || id === 'c-debt' || id === 'c-housing' || envelopeOf(id)) return;
    var nonBill = txInMonth(m).filter(function (t) { return t.type === 'expense' && t.categoryId === id && !t.billId; }).reduce(function (s, t) { return s + t.amount; }, 0);
    if (nonBill > 0) { loose[id] = nonBill; looseSum += nonBill; }
  });
  if (looseSum > 0) {
    tips.push({ cls: 'neutral', ico: 'envelope', text: money(looseSum) + ' was spent outside any envelope (' + Object.keys(loose).map(catName).join(', ') + '). Add these to an envelope so nothing slips through.' });
  }
  if (!tips.length) tips.push({ cls: 'good', ico: 'check', text: data.envelopes.length ? 'Nothing to adjust right now. Your envelopes match how you spend.' : 'Create your first envelope to get suggestions here.' });
  return tips;
}

function pageEnvelopes() {
  var m = ui.month;
  var by = spendingByCategory(m);
  var tf = 0, ts = 0;
  var states = data.envelopes.map(function (e) { var s = envState(e, m, by); tf += s.funds; ts += s.spent; return { e: e, s: s }; });
  var days = daysLeftIn(m);
  var stats = '<div class="grid grid-4">' + statCard('In envelopes', tf, 'var(--accent)') + statCard('Spent from them', ts, 'var(--spend)') +
    statCard('Left in envelopes', tf - ts, 'var(--good)', tf - ts < 0 ? 'bad' : '') +
    '<div class="card stat"><div class="label"><span class="dot" style="background:var(--warn)"></span>Days left</div><div class="value">' + days + '</div></div></div>';

  var cards = states.length ? '<div class="grid grid-2">' + states.map(function (x) {
    var e = x.e, s = x.s;
    return '<section class="card env-card" style="--env:' + esc(e.color) + '" aria-labelledby="env-' + esc(e.id) + '"><div class="card-head"><h3 id="env-' + esc(e.id) + '">' + esc(e.name) + '</h3>' +
      '<span class="pill ' + s.status.cls + '">' + esc(s.status.label) + '</span></div>' +
      '<div class="env-figs"><div><div class="big ' + (s.left < 0 ? 'bad' : '') + '">' + esc(money(s.left)) + '</div><div class="small muted">left</div></div>' +
      '<div style="text-align:right"><div class="money" style="font-weight: 600">' + esc(money(s.spent)) + ' <span class="muted small">of ' + esc(money(s.funds)) + '</span></div><div class="small muted">spent</div></div></div>' +
      paceBar(s.used, m === thisMonth() ? s.pass : 0, e.color, percent(s.used) + ' used') +
      '<p class="small muted" style="margin-top:8px">' + esc(e.categoryIds.map(catName).join(', ')) +
      (m === thisMonth() && s.left > 0 ? '. About ' + money(s.perDay) + ' a day for the rest of the month.' : '.') + '</p>' +
      '<div class="row"><button type="button" class="btn small primary" data-action="env-spend" data-id="' + esc(e.id) + '">' + icon('plus', 16) + 'Spend from it</button><span class="spacer"></span>' +
      '<button type="button" class="icon-btn" data-action="env-edit" data-id="' + esc(e.id) + '" aria-label="Edit ' + esc(e.name) + '">' + icon('edit', 18) + '</button>' +
      '<button type="button" class="icon-btn" data-action="env-delete" data-id="' + esc(e.id) + '" aria-label="Delete ' + esc(e.name) + '">' + icon('trash', 18) + '</button></div></section>';
  }).join('') + '</div>' : '<div class="card">' + emptyState('No envelopes yet', ' An envelope is a pot of money for one part of life, like Food or Fun. Start from your budget, or add your own below.',
    '<button type="button" class="btn primary small" data-action="env-from-budget">Create envelopes from my budget</button>') + '</div>';
  var monitor = '<section class="mt" aria-labelledby="envMonitorH"><div class="card-head"><h2 id="envMonitorH">Monitor progress</h2>' +
    (m === thisMonth() ? '<p class="muted small">The dark line on each bar shows how much of the month has gone.</p>' : '') + '</div>' + cards + '</section>';

  var envTx = txInMonth(m).filter(function (t) { return t.type === 'expense' && envelopeOf(t.categoryId); })
    .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  var track = '<section class="card" aria-labelledby="envTrackH"><div class="card-head"><h2 id="envTrackH">Track expenses</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="transactions">All transactions</button></div>' +
    (envTx.length ? '<ul class="list wrap-sm">' + envTx.slice(0, 8).map(function (t) {
      var e = envelopeOf(t.categoryId);
      return '<li>' + badge(initials(e.name), e.color) + '<div class="li-main"><div class="li-title">' + esc(t.note || catName(t.categoryId)) + '</div>' +
        '<div class="li-sub">' + esc(e.name + ', ' + dateLabel(t.date, { day: 'numeric', month: 'short' })) + '</div></div><span class="li-amount">−' + esc(money(t.amount)) + '</span></li>';
    }).join('') + '</ul>' + (envTx.length > 8 ? '<p class="small muted mt">And ' + (envTx.length - 8) + ' more this month.</p>' : '') :
      emptyState('Nothing spent from envelopes yet', ' Spending in an envelope’s categories shows up here automatically.')) + '</section>';

  var setForm = '<section class="card" aria-labelledby="envSetH"><div class="card-head"><h2 id="envSetH">Set budgets</h2></div>' +
    '<p class="small muted">Create an envelope, fill it each month and choose which spending comes out of it.</p>' +
    '<form data-form="env-add" data-draft="envAdd" novalidate>' + envelopeFields('ea', {}, '') +
    '<p class="error-msg" id="eaErr" role="alert"></p><button type="submit" class="btn primary">' + icon('plus', 18) + 'Add envelope</button></form></section>';

  var tips = envelopeTips(m);
  var moves = data.envelopeMoves.filter(function (mv) { return mv.month === m; });
  var envOpts = function (sel) {
    return data.envelopes.map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === sel ? ' selected' : '') + '>' + esc(e.name) + '</option>'; }).join('');
  };
  var adjust = '<section class="card mt" aria-labelledby="envAdjustH"><div class="card-head"><h2 id="envAdjustH">Adjust spending habits</h2></div>' +
    '<div class="grid grid-2"><div><h3 class="day-head">Suggestions</h3><ul class="tips-list">' + tips.map(function (t) {
      return '<li><span class="tip-ico ' + t.cls + ' ' + t.cls + '">' + icon(t.ico, 18) + '</span><span>' + esc(t.text) + '</span></li>';
    }).join('') + '</ul></div>' +
    '<div><h3 class="day-head">Move money between envelopes</h3>' +
    (data.envelopes.length > 1 ? '<form data-form="env-move" data-draft="envMove" novalidate><div class="form-grid">' +
      '<label class="field"><span>From</span><select class="input" id="emFrom" name="from">' + envOpts(data.envelopes[0].id) + '</select></label>' +
      '<label class="field"><span>To</span><select class="input" id="emTo" name="to">' + envOpts(data.envelopes[1].id) + '</select></label>' +
      '<label class="field"><span>Amount</span><input class="input money" id="emAmount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0"></label>' +
      '<button type="submit" class="btn">' + icon('arrows', 18) + 'Move</button></div><p class="error-msg" id="emErr" role="alert"></p></form>' +
      '<p class="small muted">Moves only change ' + esc(monthLabel(m)) + '. Next month starts fresh.</p>' :
      '<p class="small muted">Add at least two envelopes to move money between them.</p>') +
    (moves.length ? '<ul class="list">' + moves.map(function (mv) {
      var f = findById(data.envelopes, mv.from), t = findById(data.envelopes, mv.to);
      return '<li><div class="li-main"><div class="li-title">' + esc((f ? f.name : '?') + ' → ' + (t ? t.name : '?')) + '</div></div><span class="li-amount">' + esc(money(mv.amount)) + '</span>' +
        '<button type="button" class="icon-btn" data-action="env-move-delete" data-id="' + esc(mv.id) + '" aria-label="Undo this move">' + icon('trash', 18) + '</button></li>';
    }).join('') + '</ul>' : '') + '</div></div></section>';

  return pageHead('Envelopes', 'Give every part of your spending its own pot of money.', monthButton()) + stats + monitor +
    '<div class="grid grid-2 mt">' + track + setForm + '</div>' + adjust;
}

/* ----- Planner (calendar, notes and month summary) ----- */
var KIND_LABEL = { task: 'To-do', reminder: 'Reminder', note: 'Note' };

function weekStartDay() {
  try {
    var loc = new Intl.Locale(currentLocale());
    var info = typeof loc.getWeekInfo === 'function' ? loc.getWeekInfo() : loc.weekInfo;
    if (info && info.firstDay) return info.firstDay % 7;
  } catch (e) { /* fall back below */ }
  var region = ((/[-_]([A-Za-z]{2})\b/.exec(currentLocale()) || [])[1] || '').toUpperCase();
  return ['US', 'CA', 'JP', 'PH', 'BR', 'MX', 'IL', 'KR', 'TW', 'HK', 'IN', 'PK', 'ZA', 'SA', 'BD', 'NP', 'TH', 'ID', 'SG', 'CO', 'PE'].indexOf(region) >= 0 ? 0 : 1;
}

function plannerSelected(m) {
  if (ui.plannerDay && ui.plannerDay.slice(0, 7) === m) return ui.plannerDay;
  return m === thisMonth() ? todayStr() : m + '-01';
}

function billsOn(date) {
  var m = date.slice(0, 7);
  return data.bills.filter(function (b) { return dueDateIn(m, b.dueDay) === date; });
}

function plannerFields(idp, v, withDate) {
  var kinds = ['task', 'reminder', 'note'].map(function (k) {
    return '<label><input type="radio" name="kind" value="' + k + '"' + ((v.kind || 'task') === k ? ' checked' : '') + '><span>' + KIND_LABEL[k] + '</span></label>';
  }).join('');
  return '<div class="field"><span id="' + idp + 'KindL">Type</span><div class="seg" role="radiogroup" aria-labelledby="' + idp + 'KindL">' + kinds + '</div></div>' +
    '<label class="field"><span>Title</span><input class="input" id="' + idp + 'Title" name="title" maxlength="100" autocomplete="off" value="' + esc(v.title || '') + '" placeholder="For example, Renew car insurance"></label>' +
    '<div class="form-grid">' + (withDate ? '<label class="field"><span>Date</span><input class="input" type="date" id="' + idp + 'Date" name="date" value="' + esc(v.date || '') + '"></label>' : '') +
    '<label class="field"><span>Time <span class="muted">(optional)</span></span><input class="input" type="time" id="' + idp + 'Time" name="time" value="' + esc(v.time || '') + '"></label></div>' +
    '<label class="check"><input type="checkbox" id="' + idp + 'Imp" name="important" value="1"' + (v.important ? ' checked' : '') + '><span>Mark as important</span></label>' +
    '<label class="field"><span>Details <span class="muted">(optional)</span></span><textarea class="input" id="' + idp + 'Details" name="details" maxlength="400" style="min-height:80px" placeholder="Anything to remember">' + esc(v.details || '') + '</textarea></label>';
}

function savePlannerItem(form, id, errId, date) {
  var v = readForm(form);
  var title = cleanText(v.title, 100);
  if (!title) { showError(form, errId, 'Give it a title.', 'title'); return; }
  var d0 = id ? v.date : date;
  if (!isValidYmd(d0)) { showError(form, errId, 'Choose a date.', 'date'); return; }
  var item = {
    title: title, date: d0, kind: ['task', 'reminder', 'note'].indexOf(v.kind) >= 0 ? v.kind : 'task',
    time: /^([01]\d|2[0-3]):[0-5]\d$/.test(v.time || '') ? v.time : '', important: v.important === '1', details: cleanText(v.details, 400)
  };
  if (id) {
    commit(function (d) {
      var p = findById(d.plannerItems, id);
      if (!p) return false;
      Object.keys(item).forEach(function (k) { p[k] = item[k]; });
      if (p.kind === 'note') p.done = false;
    }, { toast: 'Saved.', undo: true });
    closeModal();
  } else {
    item.id = uid('p'); item.done = false;
    ui.drafts.plAdd = { kind: item.kind, title: '', time: '', important: '', details: '' };
    saveUiSoon();
    commit(function (d) { d.plannerItems.push(item); }, { toast: KIND_LABEL[item.kind] + ' added for ' + dateLabel(item.date, { day: 'numeric', month: 'long' }) + '.', undo: true });
    var t = $('#paTitle');
    if (t) t.focus();
  }
}

function plannerItemRow(p, showDate) {
  var toggle = p.kind === 'note' ? '<span class="icon-badge" style="background:var(--surface-2);color:var(--muted);width:30px;height:30px" aria-hidden="true">' + icon('file', 16) + '</span>' :
    '<button type="button" class="toggle-btn" data-action="pl-toggle" data-id="' + esc(p.id) + '" aria-pressed="' + p.done + '" aria-label="' + esc((p.done ? 'Mark not done: ' : 'Mark done: ') + p.title) + '">' + icon('check', 16) + '</button>';
  var sub = [KIND_LABEL[p.kind]];
  if (showDate) sub.push(dateLabel(p.date, { weekday: 'short', day: 'numeric', month: 'short' }));
  if (p.time) sub.push(p.time);
  return '<li class="' + (p.done ? 'is-done' : '') + '">' + toggle +
    '<div class="li-main"><div class="li-title">' + (p.important ? '<span class="bad" title="Important">' + icon('star', 15) + '</span> ' : '') + esc(p.title) + '</div>' +
    '<div class="li-sub">' + esc(sub.join(' · ')) + '</div>' + (p.details ? '<div class="li-sub">' + esc(p.details) + '</div>' : '') + '</div>' +
    '<button type="button" class="icon-btn" data-action="pl-edit" data-id="' + esc(p.id) + '" aria-label="Edit ' + esc(p.title) + '">' + icon('edit', 18) + '</button>' +
    '<button type="button" class="icon-btn" data-action="pl-delete" data-id="' + esc(p.id) + '" aria-label="Delete ' + esc(p.title) + '">' + icon('trash', 18) + '</button></li>';
}

function pagePlanner() {
  var m = ui.month;
  var today = todayStr();
  var sel = plannerSelected(m);
  var y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) - 1;
  var dim = daysInMonth(m);
  var start = weekStartDay();
  var lead = (new Date(y, mo, 1).getDay() - start + 7) % 7;
  var mName = monthName(mo, 'long');

  var dows = '';
  for (var i = 0; i < 7; i++) {
    dows += '<div class="cal-dow" aria-hidden="true">' + esc(dateFmt({ weekday: 'short' }).format(new Date(2024, 0, 7 + ((start + i) % 7)))) + '</div>';
  }
  var cells = '';
  for (var b = 0; b < lead; b++) cells += '<div aria-hidden="true"></div>';
  for (var day = 1; day <= dim; day++) {
    var date = m + '-' + pad2(day);
    var items = plannerItemsOn(date);
    var bills = billsOn(date);
    var wd = new Date(y, mo, day).getDay();
    var chips = [], dots = '';
    items.forEach(function (p) {
      chips.push('<span class="cal-chip ' + p.kind + (p.important ? ' imp' : '') + (p.done ? ' done' : '') + '">' + (p.time ? esc(p.time) + ' ' : '') + esc(p.title) + '</span>');
      dots += '<i class="' + (p.important ? 'imp' : p.kind) + '"></i>';
    });
    bills.forEach(function (bl) {
      var paid = !!billPayment(bl, m);
      chips.push('<span class="cal-chip bill' + (paid ? ' done' : '') + '">' + esc(bl.name) + '</span>');
      dots += '<i class="bill"></i>';
    });
    var labelParts = [dateLabel(date, { weekday: 'long', day: 'numeric', month: 'long' })];
    if (items.length) labelParts.push(items.length + (items.length === 1 ? ' entry' : ' entries'));
    if (bills.length) labelParts.push(bills.map(function (bl) { return bl.name + ' due'; }).join(', '));
    cells += '<button type="button" class="cal-day' + (date === today ? ' today' : '') + (date < today ? ' past' : '') + (wd === 0 || wd === 6 ? ' weekend' : '') + '" data-action="pl-day" data-date="' + date + '" aria-pressed="' + (date === sel) + '" aria-label="' + esc(labelParts.join('. ')) + '">' +
      '<span class="cal-num">' + day + '</span>' + chips.slice(0, 3).join('') + (chips.length > 3 ? '<span class="cal-more">+' + (chips.length - 3) + ' more</span>' : '') +
      (dots ? '<span class="cal-dots" aria-hidden="true">' + dots + '</span>' : '') + '</button>';
  }
  var cal = '<section class="card" aria-labelledby="plCalH"><div class="card-head"><h2 id="plCalH">' + esc(monthLabel(m)) + '</h2>' +
    '<div class="row"><button type="button" class="icon-btn" data-action="pick-month" data-month="' + addMonths(m, -1) + '" aria-label="Previous month">' + icon('chevL') + '</button>' +
    (m !== thisMonth() || sel !== today ? '<button type="button" class="btn small" data-action="pl-today">Today</button>' : '') +
    '<button type="button" class="icon-btn" data-action="pick-month" data-month="' + addMonths(m, 1) + '" aria-label="Next month">' + icon('chevR') + '</button></div></div>' +
    '<div class="cal">' + dows + cells + '</div>' +
    '<div class="cal-key" aria-hidden="true"><span><i style="background:var(--accent)"></i>To-do</span><span><i style="background:var(--warn)"></i>Reminder</span><span><i style="background:#8a8fa0"></i>Note</span><span><i style="background:var(--spend)"></i>Bill due</span><span><i style="background:var(--bad)"></i>Important</span></div></section>';

  // Selected day
  var dayItems = plannerItemsOn(sel);
  var dayBills = billsOn(sel);
  var dayCard = '<section class="card" aria-labelledby="plDayH"><div class="card-head"><h2 id="plDayH">' + esc(dateLabel(sel, { weekday: 'long', day: 'numeric', month: 'long' })) + '</h2>' +
    (sel === today ? '<span class="pill good">Today</span>' : '') + '</div>' +
    (dayItems.length || dayBills.length ? '<ul class="list wrap-sm">' + dayItems.map(function (p) { return plannerItemRow(p, false); }).join('') +
      dayBills.map(function (bl) {
        var paid = billPayment(bl, m);
        return '<li class="' + (paid ? 'is-done' : '') + '">' + badge(String(bl.dueDay), catColor(bl.categoryId)) + '<div class="li-main"><div class="li-title">' + esc(bl.name) + '</div><div class="li-sub">Bill, ' + esc(money(bl.amount)) + (paid ? ', paid' : '') + '</div></div>' +
          (paid ? '' : '<button type="button" class="btn small" data-action="bill-pay" data-id="' + esc(bl.id) + '">' + icon('check', 16) + 'Paid</button>') + '</li>';
      }).join('') + '</ul>' : '<p class="muted small">Nothing on this day yet.</p>') +
    '<h3 class="day-head mt">Add to this day</h3><form data-form="pl-add" data-draft="plAdd" novalidate><div class="stack">' + plannerFields('pa', { kind: 'task' }, false) +
    '<button type="submit" class="btn primary">' + icon('plus', 18) + 'Add</button></div><p class="error-msg" id="paErr" role="alert"></p></form></section>';

  // Upcoming and overdue
  var horizon = ymd(new Date(Date.now() + 14 * 86400000));
  var up = data.plannerItems.filter(function (p) { return p.kind !== 'note' && !p.done && p.date <= horizon; })
    .sort(function (a, c) { return a.date < c.date ? -1 : a.date > c.date ? 1 : (c.important - a.important); });
  var upCard = '<section class="card" aria-labelledby="plUpH"><div class="card-head"><h2 id="plUpH">Coming up</h2><p class="muted small">Next 14 days, plus anything overdue</p></div>' +
    (up.length ? '<ul class="list wrap-sm">' + up.slice(0, 8).map(function (p) {
      var row = plannerItemRow(p, true);
      return p.date < today ? row.replace('<div class="li-sub">', '<div class="li-sub"><span class="pill bad">Overdue</span> ') : row;
    }).join('') + '</ul>' + (up.length > 8 ? '<p class="small muted mt">And ' + (up.length - 8) + ' more.</p>' : '') :
      emptyState('All clear', ' No open to-dos or reminders in the next two weeks.')) + '</section>';

  // Notes for the month, then its summary
  var noteVal = data.monthNotes[m] || '';
  var notes = '<section class="card mt" aria-labelledby="plNotesH"><div class="card-head"><h2 id="plNotesH">Notes for ' + esc(mName) + '</h2><span class="save-state" id="noteState" aria-live="polite">' + (noteVal ? 'Saved' : '') + '</span></div>' +
    '<label class="field"><span class="sr-only">Notes for ' + esc(monthLabel(m)) + '</span><textarea class="input" id="monthNote" data-month-note="' + m + '" maxlength="4000" placeholder="Plans, ideas and things to remember this month. Saves as you type.">' + esc(noteVal) + '</textarea></label></section>';

  var st = monthStats(m);
  var mItems = data.plannerItems.filter(function (p) { return p.date.slice(0, 7) === m; });
  var tasks = mItems.filter(function (p) { return p.kind === 'task'; });
  var tasksDone = tasks.filter(function (p) { return p.done; }).length;
  var reminders = mItems.filter(function (p) { return p.kind === 'reminder'; }).length;
  var important = mItems.filter(function (p) { return p.important; }).length;
  var left = st.income - st.spent;
  var line = mName + ': ' + money(st.income) + ' in, ' + money(st.spent) + ' out, ' + (left >= 0 ? money(left) + ' left over. ' : money(-left) + ' more spent than earned. ') +
    (tasks.length ? tasksDone + ' of ' + tasks.length + ' to-dos done' : 'No to-dos yet') + (reminders ? ' and ' + reminders + (reminders === 1 ? ' reminder' : ' reminders') : '') + '.';
  var summary = '<section class="card mt" aria-labelledby="plSumH"><div class="card-head"><h2 id="plSumH">Summary of ' + esc(mName) + '</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="summary">Monthly summary</button></div>' +
    '<p class="glance-summary">' + esc(line) + '</p><div class="grid grid-4">' +
    miniCard('Income', money(st.income)) + miniCard('Spent', money(st.spent)) + miniCard('Left over', money(left), '', left < 0 ? 'bad' : '') +
    miniCard('Bills paid', st.billsPaid + ' of ' + st.billsTotal) + miniCard('To-dos done', tasksDone + ' of ' + tasks.length) +
    miniCard('Reminders', String(reminders)) + miniCard('Important items', String(important)) +
    miniCard('Top category', st.topCat ? catName(st.topCat.id) : '—', st.topCat ? money(st.topCat.amount) : '') + '</div></section>';

  return pageHead('Planner', 'A calendar for reminders, to-dos and notes, next to your money.', monthButton()) + cal +
    '<div class="grid grid-2 mt">' + dayCard + upCard + '</div>' + notes + summary;
}

var saveMonthNote = debounce(function (el) {
  if (!el) return;
  var m = el.getAttribute('data-month-note');
  if (!isValidMonth(m)) return;
  var v = cleanText(el.value, 4000);
  if ((data.monthNotes[m] || '') === v) return;
  if (v) data.monthNotes[m] = v; else delete data.monthNotes[m];
  data.meta.savedAt = Date.now();
  data.meta.unsaved = (data.meta.unsaved || 0) + 1;
  saveData();
  var s = $('#noteState');
  if (s) s.textContent = 'Saved';
}, 600);

/** Add a "?" button next to every page title and section heading that has help. */
function decorateHelp(root) {
  $all('h1[data-help], h2[id], #heroLabel', root).forEach(function (el) {
    var key = el.getAttribute('data-help') || HELP_BY_ID[el.id] || (/^goal-/.test(el.id) ? 'goalCard' : '');
    if (!key || !HELP[key]) return;
    var label = el.tagName === 'P' ? HELP[key].title : el.textContent;
    var btn = '<button type="button" class="help-btn" data-action="help-tip" data-key="' + esc(key) + '" aria-label="' + esc('About ' + label) + '" title="What is this?">?</button>';
    if (el.tagName === 'P') { el.insertAdjacentHTML('beforeend', btn); return; }
    var wrap = document.createElement('div');
    wrap.className = 'title-row';
    el.parentNode.insertBefore(wrap, el);
    wrap.appendChild(el);
    wrap.insertAdjacentHTML('beforeend', btn);
  });
}

var tipReturnFocus = null;
function openTip(key) {
  var t = HELP[key];
  if (!t) return;
  tipReturnFocus = document.activeElement;
  $('#tipTitle').textContent = t.title;
  $('#tipBody').innerHTML = '<p>' + esc(t.intro) + '</p>' +

}

}

/* ----- Full screen so Ctrl+N reaches the planner -----
   In a normal tab the browser keeps Ctrl+N for "new window" and never tells the page.
   Chrome and Edge let a full-screen page claim keys with the Keyboard Lock API, so in
   full screen we lock only the N key: Ctrl+N then opens Quick add, and Esc still exits. */
function keyboardLockSupported() {
  return !!(navigator.keyboard && navigator.keyboard.lock && document.documentElement.requestFullscreen);
}
var ctrlNActive = false;
function updateShortcutUi() {
  var fs = !!document.fullscreenElement;
  var lbl = $('#fsLabel');
  if (lbl) lbl.textContent = fs ? 'Exit full screen' : 'Full screen, use Ctrl+N';
  $all('.kbd-hint').forEach(function (k) { k.textContent = ctrlNActive ? 'Ctrl+N' : 'Alt+N'; });
}
function toggleShortcutMode() {
  if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); return; }
  document.documentElement.requestFullscreen().then(function () {
    return navigator.keyboard.lock(['KeyN']);
  }).then(function () {
    ctrlNActive = true;
    updateShortcutUi();
    toast('Full screen is on. Ctrl+N now opens Quick add. Press Esc to leave full screen.');
  }).catch(function () {
    updateShortcutUi();
    toast('This browser would not allow full screen here. Use Alt+N for Quick add.');
  });
}
function initShortcutMode() {
  var btn = $('#fsBtn');
  if (btn && keyboardLockSupported()) btn.hidden = false;
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) {
      ctrlNActive = false;
      try { navigator.keyboard && navigator.keyboard.unlock && navigator.keyboard.unlock(); } catch (e) { /* ignore */ }
    }
    updateShortcutUi();
  });
  updateShortcutUi();
}

/* ---------- 7. Actions, forms, dialogs and events ---------- */

/* ----- Toasts ----- */
function toast(message, action) {
  var box = $('#toasts');
  var el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<p>' + esc(message) + '</p>';
  if (action) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn small';
    b.textContent = action.action;
    b.addEventListener('click', function () { el.remove(); action.run(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(function () { if (el.parentNode) el.remove(); }, action ? 9000 : 5000);
}

/* ----- Confirmation dialog (returns a Promise<boolean>) ----- */
function confirmBox(opts) {
  return new Promise(function (resolve) {
    var dlg = $('#confirmDlg');
    $('#confirmTitle').textContent = opts.title || 'Are you sure?';
    $('#confirmText').innerHTML = opts.html || '';
    var yes = $('#confirmYes'), no = $('#confirmNo');
    yes.textContent = opts.yes || 'Continue';
    yes.className = 'btn ' + (opts.danger ? 'danger-solid' : 'primary');
    no.textContent = opts.no || 'Cancel';
    var done = false;
    function finish(v) {
      if (done) return;
      done = true;
      yes.onclick = no.onclick = null;
      dlg.removeEventListener('close', onClose);
      if (dlg.open) dlg.close();
      resolve(v);
    }
    function onClose() { finish(false); }
    yes.onclick = function () { finish(true); };
    no.onclick = function () { finish(false); };
    dlg.addEventListener('close', onClose);
    showDialog(dlg);
    try { no.focus(); } catch (e) { /* ignore */ }
  });
}

function showDialog(dlg) {
  if (dlg.open) return;
  if (typeof dlg.showModal === 'function') {
    try { dlg.showModal(); return; } catch (e) { /* fall back */ }
  }
  dlg.setAttribute('open', '');
}

/* ----- Drafts: half-typed forms survive closing the page ----- */
function readForm(form) {
  var out = {};
  $all('input[name], select[name], textarea[name]', form).forEach(function (el) {
    if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
    else if (el.type === 'checkbox') out[el.name] = el.checked ? '1' : '';
    else out[el.name] = el.value;
  });
  return out;
}

function applyValues(form, values) {
  $all('input[name], select[name], textarea[name]', form).forEach(function (el) {
    if (!(el.name in values)) return;
    var v = values[el.name];
    if (el.type === 'radio') el.checked = el.value === v;
    else if (el.type === 'checkbox') el.checked = v === '1';
    else if (el.tagName === 'SELECT') { if ($all('option', el).some(function (o) { return o.value === v; })) el.value = v; }
    else el.value = v;
  });
}

function restoreDrafts(root) {
  $all('form[data-draft]', root).forEach(function (form) {
    var d = ui.drafts[form.dataset.draft];
    if (!d) return;
    applyValues(form, d);
    syncCategorySelect(form, d.category);
  });
}

function syncCategorySelect(form, wanted) {
  var sel = $('select[data-cat-select]', form);
  if (!sel) return;
  var checked = $('input[name="type"]:checked', form);
  var type = checked ? checked.value : 'expense';
  var current = wanted || sel.value;
  sel.innerHTML = categoryOptions(type, current);
}

function saveDraft(form) {
  ui.drafts[form.dataset.draft] = readForm(form);
  saveUiSoon();
}

function clearDraft(key) {
  if (ui.drafts[key]) { delete ui.drafts[key]; saveUiSoon(); }
}

function showError(form, id, message, fieldName) {
  var p = document.getElementById(id);
  if (p) p.textContent = message;
  $all('[aria-invalid]', form).forEach(function (el) { el.removeAttribute('aria-invalid'); });
  if (fieldName) {
    var f = $('[name="' + fieldName + '"]', form);
    if (f) { f.setAttribute('aria-invalid', 'true'); f.focus(); }
  }
}

/* ----- Navigation and month picker ----- */
function goTo(page) {
  if (!PAGE_RENDER[page]) return;
  if (ui.page !== page) txLimit = 150;
  ui.page = page;
  ui.scroll[page] = 0;
  saveUiSoon();
  render();
  window.scrollTo(0, 0);
  var h = $('#view h1');
  if (h) { h.setAttribute('tabindex', '-1'); try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
}

function openMonthPicker() {
  var tools = $('#headTools');
  if (!tools) return;
  if (monthPickerOpen) { closeMonthPicker(true); return; }
  monthPickerOpen = true;
  pickerYear = Number(ui.month.slice(0, 4));
  tools.insertAdjacentHTML('beforeend', monthPickerHtml());
  $('#monthBtn').setAttribute('aria-expanded', 'true');
  var cur = $('#monthPop [aria-current="true"]') || $('#monthPop .month-grid button');
  if (cur) cur.focus();
}

function redrawMonthPicker() {
  var pop = $('#monthPop');
  if (!pop) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = monthPickerHtml();
  pop.replaceWith(tmp.firstChild);
}

function closeMonthPicker(refocus) {
  var pop = $('#monthPop');
  if (pop) pop.remove();
  monthPickerOpen = false;
  var btn = $('#monthBtn');
  if (btn) { btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus(); }
}

function setMonth(key) {
  if (!isValidMonth(key)) return;
  ui.month = key;
  txLimit = 150;
  saveUiSoon();
  render();
  var btn = $('#monthBtn');
  if (btn) btn.focus();
}

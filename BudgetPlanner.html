<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2f1">
<meta name="description" content="A private, offline budget planner. Your money data stays on your device.">
<title>Budget Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..650;1,6..72,400..650&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f6e66'/%3E%3Cpath d='M9 23c0-8 5-13 14-14 0 9-5 14-13 14M9 23l8-8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-2: #f4f7f6;
  --border: #dde4e2;
  --text: #17201d;
  --muted: #55625d;
  --good: #1b7a4e;
  --good-soft: #e3f3ea;
  --bad: #b8352f;
  --bad-soft: #fbe7e5;
  --warn: #8f5a00;
  --warn-soft: #fbefd9;
  --accent: #0f6e66;
  --accent-text: #0d5f58;
  --accent-soft: #e0f0ed;
  --on-accent: #ffffff;
  --income: #1f8a5b;
  --spend: #d0632d;
  --shadow: 0 1px 2px rgba(23, 32, 29, 0.05), 0 4px 16px rgba(23, 32, 29, 0.04);
  --radius-lg: 22px;
  --radius: 16px;
  --radius-sm: 10px;
  --font: Manrope, system-ui, sans-serif;
  --font-figure: Manrope, system-ui, sans-serif;
  --font-head: Newsreader, Georgia, serif;
  --bg-grad:
    radial-gradient(1100px 640px at 0% 0%, rgba(118, 160, 148, 0.38), transparent 62%),
    radial-gradient(950px 600px at 100% 0%, rgba(214, 184, 150, 0.34), transparent 60%),
    radial-gradient(1000px 760px at 55% 100%, rgba(160, 150, 196, 0.30), transparent 62%),
    linear-gradient(160deg, #eef0ea 0%, #e9eeec 45%, #ebe8f0 100%);
  --glass: rgba(255, 255, 255, 0.72);
  --card-grad: linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(249, 249, 246, 0.88) 100%);
  --grad-to: #2f3560;
  --nav-h: 64px;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #0e1312;
  --surface: #161c1b;
  --surface-2: #1d2524;
  --border: #2a3432;
  --text: #e7eeec;
  --muted: #9fb0ab;
  --good: #5cc98f;
  --good-soft: #17322a;
  --bad: #ff8a80;
  --bad-soft: #3a1e1c;
  --warn: #f0b252;
  --warn-soft: #36290f;
  --income: #4cc38a;
  --spend: #f08a52;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  --bg-grad:
    radial-gradient(1100px 620px at 0% 0%, rgba(70, 120, 110, 0.20), transparent 62%),
    radial-gradient(900px 560px at 100% 0%, rgba(140, 110, 80, 0.14), transparent 60%),
    radial-gradient(900px 700px at 60% 100%, rgba(100, 90, 140, 0.16), transparent 60%),
    linear-gradient(165deg, #10151a 0%, #0f1413 50%, #13121a 100%);
  --glass: rgba(22, 28, 27, 0.72);
  --card-grad: linear-gradient(180deg, rgba(26, 33, 32, 0.94) 0%, rgba(21, 27, 27, 0.88) 100%);
  --grad-to: #c9d4ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  background: var(--bg-grad);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
h1, h2, h3 { line-height: 1.2; margin: 0; font-weight: 600; font-family: var(--font-head); letter-spacing: 0; }
h1 { font-size: 2rem; font-weight: 650; }
.brand { font-family: var(--font-head); font-weight: 600; font-size: 1.1875rem; }
h2 { font-size: 1.125rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 0.75em; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .money { font-family: var(--font-figure); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.good { color: var(--good); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 100;
  background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: 10px;
}
.skip-link:focus { top: 12px; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; width: 248px; flex: none;
  display: flex; flex-direction: column; gap: 6px;
  padding: 22px 14px; background: var(--surface); border-right: 1px solid var(--border);
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 14px; font-weight: 650; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; flex: none;
}
.nav-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border: 0; background: transparent; border-radius: 12px; cursor: pointer; text-align: left;
  color: var(--muted); font-weight: 500; font-size: 0.9375rem; white-space: nowrap;
}
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-btn svg { flex: none; }
.sidebar-foot { margin-top: auto; padding: 12px 10px 0; font-size: 0.8125rem; color: var(--muted); }

.main { flex: 1; min-width: 0; }
.main-inner { max-width: 1120px; margin: 0 auto; padding: 28px 32px 64px; }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-bottom: 22px;
}
.page-head .sub { color: var(--muted); margin: 4px 0 0; }
.head-tools { display: flex; gap: 8px; align-items: center; position: relative; }

.bottom-nav, .fab { display: none; }

/* ---------- Cards & grids ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head p { margin: 0; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.mt { margin-top: 16px; }

/* Hero: safe to spend */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center;
  padding: 26px 28px; border-radius: var(--radius-lg);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
}
.hero-ring { position: relative; width: 168px; height: 168px; }
.hero-ring svg { display: block; }
.hero-ring .ring-label {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  font-size: 0.8125rem; color: var(--muted); line-height: 1.25; padding: 30px;
}
.hero-ring .ring-label strong { display: block; font-family: var(--font-figure); font-size: 1.5rem; color: var(--text); font-weight: 650; }
.hero-bar { display: none; }
.hero-label { color: var(--muted); font-weight: 500; margin: 0 0 2px; }
.hero-figure {
  font-family: var(--font-figure); font-variant-numeric: tabular-nums;
  font-size: clamp(2.5rem, 6vw, 3.75rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05;
  overflow-wrap: anywhere;
}
.hero-figure .per { font-size: 1rem; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.hero-note { margin: 10px 0 0; color: var(--muted); font-size: 0.9375rem; max-width: 60ch; }
.estimate-tag {
  display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-text); vertical-align: middle; margin-left: 6px;
}

.stat { padding: 16px 18px; }
.stat .label { color: var(--muted); font-size: 0.875rem; display: flex; align-items: center; gap: 8px; }
.stat .value { font-family: var(--font-figure); font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 650; margin-top: 4px; overflow-wrap: anywhere; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); min-width: 0; }
.list > li:first-child { border-top: 0; padding-top: 4px; }
.li-main { flex: 1; min-width: 0; }
.li-title { font-weight: 500; overflow-wrap: anywhere; }
.li-sub { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
.li-amount { font-family: var(--font-figure); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
.icon-badge {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none;
  color: #fff; font-weight: 650; font-size: 0.875rem;
}
.day-head { margin: 18px 0 4px; color: var(--muted); font-size: 0.875rem; font-weight: 600; }
.day-head:first-child { margin-top: 0; }

/* Progress */
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.over > span { background: var(--bad); }
.bar.done > span { background: var(--good); }

/* Pills / chips */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn svg { flex: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 0.875rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }
.icon-btn {
  width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px;
  border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.quick-add-btn { margin-bottom: 6px; }
.fs-btn { margin-bottom: 6px; justify-content: center; color: var(--muted); font-size: 0.8125rem; }
@media (hover: none) and (pointer: coarse) { .fs-btn { display: none !important; } }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span, .field > label { font-size: 0.875rem; font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
.input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.input:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; }
.input[aria-invalid="true"] { border-color: var(--bad); }
.hint { font-size: 0.8125rem; color: var(--muted); }
.error-msg { font-size: 0.8125rem; color: var(--bad); min-height: 0; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
.seg button, .seg label {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--muted);
}
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg [aria-pressed="true"], .seg input:checked + span { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg label span { display: inline-block; padding: 7px 14px; border-radius: 9px; margin: -7px -14px; }
.seg input:focus-visible + span { outline: 3px solid var(--accent); }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Month picker */
.month-btn { font-family: var(--font-figure); }
.month-pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: 300px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18); padding: 14px;
}
.month-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.month-pop-head strong { font-family: var(--font-figure); font-size: 1.125rem; }
.month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.month-grid button {
  min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 500;
}
.month-grid button:hover { background: var(--surface-2); }
.month-grid button[aria-current="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.month-grid button.is-today { border-color: var(--accent); }
.month-pop-foot { margin-top: 10px; display: flex; justify-content: center; }

/* Banner */
.banner {
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding: 14px 18px; border-radius: var(--radius); margin-bottom: 18px;
  background: var(--accent-soft); color: var(--text); border: 1px solid var(--border);
}
.banner.warn { background: var(--warn-soft); }
.banner p { margin: 0; flex: 1 1 260px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.875rem; margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.donut-wrap { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; }
.donut-list li { padding: 8px 0; }

/* Year */
.year-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.month-card {
  text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 14px;
  border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); min-width: 0;
}
.month-card:hover { border-color: var(--accent); }
.month-card .mc-row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.875rem; }
.month-card .mc-row span:last-child { font-family: var(--font-figure); font-variant-numeric: tabular-nums; }
.month-card.future { opacity: 0.6; }
.yr-switch { display: inline-flex; align-items: center; gap: 4px; }
.yr-switch strong { font-family: var(--font-figure); font-size: 1.125rem; min-width: 4ch; text-align: center; }

/* Debt */
.strategy-card { border-width: 2px; }
.strategy-card.best { border-color: var(--accent); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 10px 0 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-figure); font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }

/* Swatches */
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--border);
  cursor: pointer; display: grid; place-items: center; color: #fff;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text); }

.month-card .bar { display: block; width: 100%; margin-top: 4px; }

/* Snapshots */
.snap-list li { flex-wrap: wrap; }

/* Help */
details.faq { border-top: 1px solid var(--border); padding: 12px 0; }
details.faq:first-of-type { border-top: 0; }
details.faq summary { cursor: pointer; font-weight: 600; list-style-position: outside; }
details.faq p { margin: 8px 0 0; color: var(--muted); max-width: 70ch; }

/* Empty states */
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty strong { display: block; color: var(--text); margin-bottom: 4px; }

/* Dialogs */
dialog {
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; background: var(--surface); color: var(--text);
  width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
}
dialog::backdrop { background: rgba(10, 16, 14, 0.45); }
.dlg-body { padding: 22px; overflow-y: auto; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

/* Toast */
.toasts {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(460px, calc(100vw - 24px));
  pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--text); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); animation: toast-in 0.18s ease-out;
}
.toast p { margin: 0; flex: 1; }
.toast .btn { background: transparent; color: var(--bg); border-color: rgba(127, 127, 127, 0.5); min-height: 34px; padding: 4px 12px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Sheet (mobile "More") */
.sheet-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sheet-grid .btn { justify-content: flex-start; min-height: 54px; white-space: normal; text-align: left; min-width: 0; }

/* Tables for tx filters */
.filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }

/* Help "?" buttons and tips */
.title-row { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.page-head .title-row { display: flex; }
#pageTitle:focus { outline: none; }
.pace + .pace-legend, .pace-legend + * { margin-bottom: 4px; }
.help-btn {
  width: 24px; height: 24px; padding: 0; border-radius: 50%; flex: none; cursor: pointer;
  display: inline-grid; place-items: center; font: 700 0.8125rem/1 var(--font);
  border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); vertical-align: middle;
}
.help-btn:hover { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent); }
h1 + .help-btn, .title-row h1 + .help-btn { width: 28px; height: 28px; font-size: 0.9375rem; }
.hero-label .help-btn { margin-left: 6px; }
.tip-mark { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; flex: none; }
.tip-list { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
.tip-list li { margin: 4px 0; }
.kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; font-weight: 600;
  padding: 1px 7px; border-radius: 6px; line-height: 1.4; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.16);
}
.kbd.plain { border-color: var(--border); background: var(--surface-2); color: var(--text); }
@media (hover: none) and (pointer: coarse) { .kbd-hint { display: none; } }

/* Greeting */

<script>
(function () {
'use strict';
/* =========================================================
   Budget Planner — a private, offline budgeting tool.
   Everything stays in this browser. No server, no tracking.
   Sections: 1 utilities, 2 storage, 3 data, 4 state, 5 charts,
   6 pages, 7 actions, 8 files (backup + editable file), 9 start-up
   ========================================================= */

/* ---------- 1. Utilities ---------- */

var APP_ID = 'budget-planner';
var DATA_VERSION = 2;
var MAX_CENTS = 99999999999; // just under one billion in any currency

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uid(prefix) {
  return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

function safeInt(n) {
  n = Number(n);
  if (!Number.isFinite(n)) return 0;
  return Math.round(n);
}

function debounce(fn, ms) {
  var t = null, lastArgs = [];
  var wrapped = function () {
    var args = arguments;
    lastArgs = args;
    clearTimeout(t);
    t = setTimeout(function () { t = null; fn.apply(null, args); }, ms);
  };
  wrapped.flush = function () { if (t) { clearTimeout(t); t = null; fn.apply(null, lastArgs); } };
  return wrapped;
}

/* ----- Money: everything is stored as whole cents (integers) ----- */

/** Decimal separator for the current locale ("." or ","). */
function localeDecimal() {
  try {
    var parts = new Intl.NumberFormat(currentLocale()).formatToParts(1.5);
    for (var i = 0; i < parts.length; i++) if (parts[i].type === 'decimal') return parts[i].value;
  } catch (e) { /* fall through */ }
  return '.';
}

/**
 * Turn text such as "1,234.56", "1.234,56", "12,5", "$ 40" or "(12.00)" into cents.
 * decimalHint says which separator is the decimal mark when the text alone is ambiguous.
 * Returns an integer number of cents, or null if the text is not a number.
 */
function parseMoney(input, decimalHint) {
  if (input == null) return null;
  var s = String(input).trim();
  if (!s) return null;
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[\s   '’]/g, '');
  s = s.replace(/[−‒–]/g, '-');
  s = s.replace(/[^0-9.,+\-]/g, '');
  if (s.charAt(0) === '-') { neg = !neg; s = s.slice(1); }
  else if (s.charAt(0) === '+') { s = s.slice(1); }
  if (s.charAt(s.length - 1) === '-') { neg = !neg; s = s.slice(0, -1); }
  if (!/^[0-9.,]+$/.test(s) || !/[0-9]/.test(s)) return null;

  var hint = decimalHint === ',' ? ',' : '.';
  var lastDot = s.lastIndexOf('.');
  var lastComma = s.lastIndexOf(',');
  var dec = null;
  if (lastDot >= 0 && lastComma >= 0) {
    dec = lastDot > lastComma ? '.' : ',';
  } else if (lastDot >= 0 || lastComma >= 0) {
    var sep = lastDot >= 0 ? '.' : ',';
    var parts = s.split(sep);
    if (parts.length > 2) {
      dec = null; // "1.234.567" – only grouping
    } else {
      var after = parts[1];
      var looksGrouped = after.length === 3 && parts[0].length > 0 && parts[0] !== '0';
      dec = (looksGrouped && sep !== hint) ? null : sep;
    }
  }
  var intPart = s;
  var frac = '';
  if (dec) {
    var idx = s.lastIndexOf(dec);
    intPart = s.slice(0, idx);
    frac = s.slice(idx + 1);
  }
  if (/[.,]/.test(frac)) return null;
  intPart = intPart.replace(/[.,]/g, '').replace(/^0+(?=\d)/, '');
  if (!intPart) intPart = '0';
  if (intPart.length > 12) return null;
  frac = (frac + '000').slice(0, 3);
  var cents = Number(intPart) * 100 + Number(frac.slice(0, 2)) + (Number(frac.charAt(2)) >= 5 ? 1 : 0);
  if (!Number.isFinite(cents) || cents > MAX_CENTS) return null;
  return neg ? -cents : cents;

/** Cents → "1234.56" (dot decimal, no grouping). Exact, no floating point. */
function centsToPlain(cents) {
  cents = safeInt(cents);
  var neg = cents < 0;
  var abs = Math.abs(cents);
  var whole = Math.floor(abs / 100);
  var rest = abs % 100;
  return (neg ? '-' : '') + whole + '.' + (rest < 10 ? '0' : '') + rest;
}

/** Cents → text for an input box, using the locale decimal mark ("1234,56"). */
function centsToInput(cents) {
  if (cents == null || cents === '') return '';

  d.meta.savedAt = safeInt(m.savedAt) || Date.now();
  d.meta.unsaved = Math.max(0, safeInt(m.unsaved));
  d.meta.lastBackupAt = Math.max(0, safeInt(m.lastBackupAt));
  d.meta.sample = !!m.sample;
  d.meta.sampleBannerHidden = !!m.sampleBannerHidden;

  var seen = {};
  d.categories = [];
  raw.categories.forEach(function (c, i) {
    if (!c || typeof c !== 'object') return;
    var id = cleanText(c.id, 60) || uid('c');
    if (seen[id]) return;
    var name = cleanText(c.name, 40);
    if (!name) return;
    seen[id] = true;
    d.categories.push({
      id: id, name: name, type: c.type === 'income' ? 'income' : 'expense',
      color: cleanColor(c.color, i), budget: Math.max(0, cleanCents(c.budget) || 0)
    });
  });
  // The two "Other" categories must always exist.
  if (!seen['c-other']) d.categories.push({ id: 'c-other', name: 'Other', type: 'expense', color: '#bab0ac', budget: 0 });
  if (!seen['c-other-in']) d.categories.push({ id: 'c-other-in', name: 'Other income', type: 'income', color: '#86bcb6', budget: 0 });
  var catType = {};
  d.categories.forEach(function (c) { catType[c.id] = c.type; });

  var billIds = {};
  d.bills = [];
  (Array.isArray(raw.bills) ? raw.bills : []).forEach(function (b) {
    if (!b || typeof b !== 'object') return;

    var amount = cleanCents(b.amount);
    if (!name || amount == null) return;
    var id = cleanText(b.id, 60) || uid('b');
    if (billIds[id]) id = uid('b');
    billIds[id] = true;
    var cat = catType[b.categoryId] === 'expense' ? b.categoryId : 'c-other';

  d.transactions = [];

    if (txIds[id]) id = uid('t');

    var tx = { id: id, type: type, amount: amount, categoryId: cat, date: t.date, note: cleanText(t.note, 140) };

  d.goals = [];
  (Array.isArray(raw.goals) ? raw.goals : []).forEach(function (g) {

  (Array.isArray(raw.milestones) ? raw.milestones : []).forEach(function (x) {

  var usedCat = {}, envIds = {};
  d.envelopes = [];
  (Array.isArray(raw.envelopes) ? raw.envelopes : []).forEach(function (e, i) {

  });
  d.envelopeMoves = [];
  (Array.isArray(raw.envelopeMoves) ? raw.envelopeMoves : []).forEach(function (mv) {

        limit: Math.max(0, cleanCents(v.limit) || 0), focus: cleanText(v.focus, 200), review: cleanText(v.review, 1000)

var data = null;      // everything the user owns
var ui = null;        // where they are in the app (page, month, filters, half-typed forms)
var undoStack = [];
var snapshots = [];   // [{ id, at, reason, json, summary }]
var lastSnapshotJson = '';
var started = false;

function defaultUi() {
  return {
    page: 'overview',
    month: thisMonth(),
    year: Number(thisMonth().slice(0, 4)),
    txFilters: { search: '', type: 'all', category: 'all', scope: 'month' },
    drafts: {},
    scroll: {},
    modal: null,
    debtStrategy: 'avalanche',
    plannerDay: ''
  };
}

function normalizeUi(raw) {
  var u = defaultUi();
  if (!raw || typeof raw !== 'object') return u;
  if (PAGES.some(function (p) { return p.id === raw.page; })) u.page = raw.page;
  if (isValidMonth(raw.month)) u.month = raw.month;
  if (Number.isInteger(raw.year) && raw.year > 1970 && raw.year < 2200) u.year = raw.year;
  var f = raw.txFilters || {};
  u.txFilters.search = cleanText(f.search, 80);
  u.txFilters.type = ['all', 'income', 'expense'].indexOf(f.type) >= 0 ? f.type : 'all';
  u.txFilters.category = typeof f.category === 'string' ? f.category : 'all';
  u.txFilters.scope = f.scope === 'all' ? 'all' : 'month';
  if (raw.drafts && typeof raw.drafts === 'object') {
    Object.keys(raw.drafts).forEach(function (k) {
      var v = raw.drafts[k];
      if (v && typeof v === 'object') {
        var clean = {};
        Object.keys(v).forEach(function (f2) { clean[f2] = cleanText(v[f2], 200); });
        u.drafts[k] = clean;
      }
    });
  }
  if (raw.scroll && typeof raw.scroll === 'object') {
    Object.keys(raw.scroll).forEach(function (k) { u.scroll[k] = Math.max(0, safeInt(raw.scroll[k])); });
  }
  if (raw.modal && typeof raw.modal === 'object' && typeof raw.modal.kind === 'string') {
    u.modal = { kind: raw.modal.kind, id: typeof raw.modal.id === 'string' ? raw.modal.id : '' };
  }
  u.debtStrategy = raw.debtStrategy === 'snowball' ? 'snowball' : 'avalanche';
  u.plannerDay = isValidYmd(raw.plannerDay) ? raw.plannerDay : '';
  return u;
}

/* ----- Saving ----- */

var idbDataWrite = debounce(function () { idbSet('data', JSON.stringify(data)); }, 250);

function saveData() {
  var json = JSON.stringify(data);
  ls.set(KEY_DATA, json);
  idbDataWrite();
  scheduleAutoFile();
}

var saveUiSoon = debounce(saveUiNow, 300);
function saveUiNow() {
  if (!ui) return;
  var json = JSON.stringify(ui);
  ls.set(KEY_UI, json);
  idbSet('ui', json);
}

/**
 * Change the data, save it and redraw.
 * opts.toast: message to show; opts.undo: offer an Undo button;
 * opts.risky: take a snapshot of the data before the change (with this reason).
 */
function commit(change, opts) {
  opts = opts || {};
  var before = JSON.stringify(data);
  var result = change(data);
  if (result === false) return false;
  if (opts.risky) takeSnapshot(opts.risky, before);
  undoStack.push(before);
  if (undoStack.length > 40) undoStack.shift();
  data.meta.savedAt = Date.now();
  data.meta.unsaved = (data.meta.unsaved || 0) + 1;
  saveData();
  render();
  if (opts.toast) toast(opts.toast, opts.undo ? { action: 'Undo', run: undo } : null);
  return true;
}

/** Replace all data at once (restore, import, sample, reset). Always snapshots first. */
function replaceData(newData, reason, message) {
  takeSnapshot(reason || 'Before replacing data');
  undoStack.push(JSON.stringify(data));
  data = newData;
  data.meta.savedAt = Date.now();
  data.meta.unsaved = (data.meta.unsaved || 0) + 1;
  fmtCache = {};
  applyTheme();
  saveData();
  render();
  if (message) toast(message, { action: 'Undo', run: undo });
}

function undo() {
  if (!undoStack.length) { toast('Nothing to undo.'); return; }
  var prev = safeJsonParse(undoStack.pop());
  if (!prev) return;
  try { data = normalizeData(prev); } catch (e) { return; }
  data.meta.savedAt = Date.now();
  fmtCache = {};
  applyTheme();
  saveData();
  render();
  toast('Undone.');
}

function markBackedUp() {
  data.meta.unsaved = 0;
  data.meta.lastBackupAt = Date.now();
  saveData();
}

/* ----- Snapshots: newest 12, plus one per day for older days (up to 30 days) ----- */

function snapshotSummary(json) {
  var d = safeJsonParse(json);
  if (!d) return '';
  var n = (d.transactions || []).length;
  return n + (n === 1 ? ' transaction' : ' transactions') + ', ' + (d.bills || []).length + ' bills, ' +
    (d.goals || []).length + ' goals, ' + (d.debts || []).length + ' debts';
}

function takeSnapshot(reason, json) {
  if (!data) return;
  json = json || JSON.stringify(data);
  if (snapshots.length && snapshots[0].json === json) {
    // Same data as the newest snapshot: keep one copy, but label it with the latest reason.
    if (reason && reason !== snapshots[0].reason) { snapshots[0].reason = reason; snapshots[0].at = Date.now(); persistSnapshots(); }
    lastSnapshotJson = json;
    return;
  }
  snapshots.unshift({ id: uid('s'), at: Date.now(), reason: reason || 'Automatic', json: json, summary: snapshotSummary(json) });
  lastSnapshotJson = json;
  pruneSnapshots();
  persistSnapshots();
}

function pruneSnapshots() {
  snapshots.sort(function (a, b) { return b.at - a.at; });
  var keep = snapshots.slice(0, 12);
  var days = {};
  keep.forEach(function (s) { days[ymd(new Date(s.at))] = true; });
  var olderDays = 0;
  snapshots.slice(12).forEach(function (s) {
    var day = ymd(new Date(s.at));
    if (!days[day] && olderDays < 30) { days[day] = true; olderDays++; keep.push(s); }
  });
  snapshots = keep;
}

function persistSnapshots() {
  var plain = snapshots.map(function (s) { return { id: s.id, at: s.at, reason: s.reason, json: s.json, summary: s.summary }; });
  idbSet('snapshots', plain);
  // localStorage has less room, so fall back to fewer snapshots there if needed.
  var json = JSON.stringify(plain);
  if (!ls.set(KEY_SNAPS, json)) {
    if (!ls.set(KEY_SNAPS, JSON.stringify(plain.slice(0, 12)))) {
      if (!ls.set(KEY_SNAPS, JSON.stringify(plain.slice(0, 3)))) ls.remove(KEY_SNAPS);
    }
  }
}

function mergeSnapshots(a, b) {
  var byId = {};
  (a || []).concat(b || []).forEach(function (s) {
    if (s && typeof s.json === 'string' && typeof s.at === 'number' && s.id) byId[s.id] = {
      id: String(s.id), at: s.at, reason: cleanText(s.reason, 80), json: s.json, summary: cleanText(s.summary, 120) || snapshotSummary(s.json)
    };
  });
  return Object.keys(byId).map(function (k) { return byId[k]; });
}

function snapshotIfChanged(reason) {
  if (!data) return;
  var json = JSON.stringify(data);
  if (json !== lastSnapshotJson) takeSnapshot(reason, json);
}

/* ---------- Calculations ---------- */

function catById(id) {
  for (var i = 0; i < data.categories.length; i++) if (data.categories[i].id === id) return data.categories[i];
  return null;
}
function catName(id) { var c = catById(id); return c ? c.name : 'Other'; }
function catColor(id) { var c = catById(id); return c ? c.color : '#bab0ac'; }
function categoriesOf(type) { return data.categories.filter(function (c) { return c.type === type; }); }

function txInMonth(monthKey) {
  return data.transactions.filter(function (t) { return t.date.slice(0, 7) === monthKey; });
}

function billPayment(bill, monthKey) {
  for (var i = 0; i < data.transactions.length; i++) {
    var t = data.transactions[i];
    if (t.billId === bill.id && t.billMonth === monthKey) return t;
  }
  return null;
}

function monthTotals(monthKey) {
  var income = 0, spent = 0, billsDue = 0;
  txInMonth(monthKey).forEach(function (t) { if (t.type === 'income') income += t.amount; else spent += t.amount; });
  data.bills.forEach(function (b) { if (!billPayment(b, monthKey)) billsDue += b.amount; });
  return { income: income, spent: spent, billsDue: billsDue, left: income - spent - billsDue };
}

function spendingByCategory(monthKey) {
  var map = {};
  txInMonth(monthKey).forEach(function (t) {
    if (t.type !== 'expense') return;
    map[t.categoryId] = (map[t.categoryId] || 0) + t.amount;
  });
  return map;
}

/** Days left in the month including today; 0 for past months, full month for future months. */
function daysLeftIn(monthKey) {
  var now = thisMonth();
  if (monthKey < now) return 0;
  if (monthKey > now) return daysInMonth(monthKey);
  return daysInMonth(monthKey) - new Date().getDate() + 1;
}

function safeToSpend(monthKey) {
  var t = monthTotals(monthKey);
  var days = daysLeftIn(monthKey);
  var perDay = days > 0 ? Math.floor(Math.max(0, t.left) / days) : 0;
  return { totals: t, days: days, perDay: perDay };
}

/* ----- Debt payoff simulation (all in cents) ----- */
function simulateDebts(debts, extra, strategy) {
  var list = debts.filter(function (d) { return d.balance > 0; }).map(function (d) {
    return { id: d.id, name: d.name, bal: d.balance, rate: d.rate, min: d.minPayment, paidMonth: null };
  });
  var order = list.slice();
  if (strategy === 'snowball') order.sort(function (a, b) { return a.bal - b.bal || b.rate - a.rate; });
  else if (strategy === 'avalanche') order.sort(function (a, b) { return b.rate - a.rate || a.bal - b.bal; });
  var minimumsOnly = strategy === 'minimum';
  var budget = list.reduce(function (s, d) { return s + d.min; }, 0) + (minimumsOnly ? 0 : extra);
  var totalInterest = 0;
  var series = [list.reduce(function (s, d) { return s + d.bal; }, 0)];
  var months = 0;
  var LIMIT = 600;
  while (months < LIMIT && list.some(function (d) { return d.bal > 0; })) {
    months++;
    list.forEach(function (d) {
      if (d.bal <= 0) return;
      var interest = Math.round(d.bal * d.rate / 100 / 12);
      d.bal += interest;
      totalInterest += interest;
    });
    var left = budget;
    list.forEach(function (d) {
      if (d.bal <= 0) return;
      var p = Math.min(d.bal, d.min);
      d.bal -= p;
      left -= p;
    });
    if (!minimumsOnly) {
      order.forEach(function (d) {
        if (d.bal <= 0 || left <= 0) return;
        var p = Math.min(d.bal, left);
        d.bal -= p;
        left -= p;
      });
    }
    list.forEach(function (d) { if (d.bal <= 0 && d.paidMonth === null) { d.bal = 0; d.paidMonth = months; } });
    series.push(list.reduce(function (s, d) { return s + Math.max(0, d.bal); }, 0));
  }
  var finished = !list.some(function (d) { return d.bal > 0; });
  return {
    months: months, finished: finished, totalInterest: totalInterest, series: series,
    order: order.map(function (d) { return { id: d.id, name: d.name, paidMonth: d.paidMonth }; })
  };
}

function monthsFromNowLabel(n) {

/* ---------- 5. Charts (inline SVG, no libraries) ---------- */

function isNarrow() { return window.innerWidth < 600; }

/** Width in CSS pixels a chart will get inside a card, so its text stays a readable size. */
function chartWidth(half) {
  var view = document.getElementById('view');
  var w = 900;
  if (view) {
    var cs = window.getComputedStyle(view);
    w = view.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  }
  var twoCols = window.innerWidth >= 900;
  var cardPad = twoCols ? 42 : 34;
  if (half && twoCols) w = (w - 16) / 2;
  return Math.max(260, Math.round(w - cardPad));
}

function niceStep(maxValue, steps) {
  if (!(maxValue > 0)) return 10000;
  var raw = maxValue / steps;
  var pow = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / pow;
  var nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return nice * pow;
}

/** Progress ring. fraction 0..1 */
function ringSvg(fraction, size, color) {
  fraction = Number.isFinite(fraction) ? clamp(fraction, 0, 1) : 0;
  var stroke = size > 140 ? 14 : 12;
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var len = c * fraction;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + stroke + '"/>' +
    (len > 0.5 ? '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || 'var(--accent)') +
      '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + len.toFixed(2) + ' ' + c.toFixed(2) +
      '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' : '') +
    '</svg>';
}

/** Donut chart. segments: [{ value, color, label }] */
function donutSvg(segments, size, centerTop, centerBottom) {
  var stroke = 24;
  var r = (size - stroke) / 2;
  var c = 2 * Math.PI * r;
  var total = segments.reduce(function (s, x) { return s + Math.max(0, x.value); }, 0);
  var out = '<svg class="chart" style="max-width:' + size + 'px" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' +
    esc('Spending by category: ' + segments.map(function (s) { return s.label + ' ' + money(s.value); }).join(', ')) + '">';
  out += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="' + stroke + '"/>';
  if (total > 0) {
    var offset = 0;
    var gap = segments.length > 1 ? 2 : 0;
    segments.forEach(function (s) {
      var len = c * (Math.max(0, s.value) / total);
      var drawn = Math.max(0, len - gap);
      if (drawn > 0.3) {
        out += '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + esc(s.color) +
          '" stroke-width="' + stroke + '" stroke-dasharray="' + drawn.toFixed(2) + ' ' + c.toFixed(2) +
          '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')">' +
          '<title>' + esc(s.label + ': ' + money(s.value)) + '</title></circle>';
      }
      offset += len;
    });
  }
  out += '<text x="50%" y="47%" text-anchor="middle" style="fill:var(--text);font-size:17px;font-weight:650;font-family:var(--font-figure)">' + esc(centerTop) + '</text>';
  out += '<text x="50%" y="60%" text-anchor="middle" style="font-size:12px">' + esc(centerBottom) + '</text>';
  return out + '</svg>';
}

/** Grouped bars. groups: [{ label, a, b }]; series: [{ name, color }] for a and b */
function barsSvg(groups, series, ariaLabel, highlightIndex, width) {
  var W = width || chartWidth(false);
  var narrow = W < 480;
  var H = narrow ? 200 : 240;
  var padL = narrow ? 50 : 60, padR = 8, padT = 12, padB = 28;
  var max = 0;
  groups.forEach(function (g) { max = Math.max(max, g.a, g.b); });
  var step = niceStep(max, 4);
  var steps = Math.max(1, Math.ceil(Math.max(max, 1) / step));
  var top = step * steps;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var slot = plotW / groups.length;
  var bw = Math.max(3, Math.min(narrow ? 14 : 24, slot * 0.3));
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ariaLabel) + '">';
  for (var i = 0; i <= steps; i++) {
    var y = padT + plotH - plotH * i / steps;
    out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)" stroke-width="1"' + (i === 0 ? '' : ' stroke-dasharray="3 4"') + '/>';
    out += '<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + esc(money(step * i, { compact: true })) + '</text>';
  }
  groups.forEach(function (g, gi) {
    var cx = padL + slot * gi + slot / 2;
    [['a', -1], ['b', 1]].forEach(function (pair, si) {
      var v = Math.max(0, g[pair[0]]);
      var h = top > 0 ? plotH * v / top : 0;
      if (h > 0 && h < 2) h = 2;
      var x = cx + (pair[1] < 0 ? -bw - 1 : 1);
      var y = padT + plotH - h;
      if (h > 0) {
        out += '<path d="' + roundedTopRect(x, y, bw, h, Math.min(4, bw / 2)) + '" fill="' + series[si].color + '">' +
          '<title>' + esc(g.label + ', ' + series[si].name + ': ' + money(v)) + '</title></path>';
      }
    });
    out += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle"' +
      (gi === highlightIndex ? ' style="fill:var(--text);font-weight:650"' : '') + '>' + esc(g.label) + '</text>';
  });
  return out + '</svg>';
}

function roundedTopRect(x, y, w, h, r) {
  r = Math.min(r, h);
  return 'M' + x.toFixed(1) + ' ' + (y + h).toFixed(1) +
    'V' + (y + r).toFixed(1) +
    'Q' + x.toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ' ' + y.toFixed(1) +
    'H' + (x + w - r).toFixed(1) +
    'Q' + (x + w).toFixed(1) + ' ' + y.toFixed(1) + ' ' + (x + w).toFixed(1) + ' ' + (y + r).toFixed(1) +
    'V' + (y + h).toFixed(1) + 'Z';
}

/** Line chart of balances over months. lines: [{ name, color, values, dashed }] */
function linesSvg(lines, ariaLabel, width) {
  var W = width || chartWidth(false);
  var narrow = W < 480;
  var H = narrow ? 220 : 260;
  var padL = narrow ? 50 : 64, padR = 12, padT = 12, padB = 28;
  var maxLen = 1, maxV = 0;
  lines.forEach(function (l) {
    maxLen = Math.max(maxLen, l.values.length);
    l.values.forEach(function (v) { maxV = Math.max(maxV, v); });
  });
  var step = niceStep(maxV, 4);
  var steps = Math.max(1, Math.ceil(Math.max(maxV, 1) / step));
  var top = step * steps;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var months = maxLen - 1 || 1;
  function px(i) { return padL + plotW * i / months; }
  function py(v) { return padT + plotH - (top > 0 ? plotH * v / top : 0); }
  var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(ariaLabel) + '">';
  for (var i = 0; i <= steps; i++) {
    var y = py(step * i);
    out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--border)"' + (i === 0 ? '' : ' stroke-dasharray="3 4"') + '/>';
    out += '<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + esc(money(step * i, { compact: true })) + '</text>';
  }
  var yearStep = months > 120 ? 24 : months > 48 ? 12 : months > 18 ? 6 : 3;
  for (var m = 0; m <= months; m += yearStep) {
    var lbl = monthLabel(addMonths(thisMonth(), m), 'short');
    if (narrow || months > 48) lbl = addMonths(thisMonth(), m).slice(0, 4);
    out += '<text x="' + px(m).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (m === 0 ? 'start' : 'middle') + '">' + esc(lbl) + '</text>';
  }
  lines.forEach(function (l) {
    if (!l.values.length) return;
    var d = l.values.map(function (v, idx) { return (idx ? 'L' : 'M') + px(idx).toFixed(1) + ' ' + py(v).toFixed(1); }).join('');
    out += '<path d="' + d + '" fill="none" stroke="' + l.color + '" stroke-width="' + (l.dashed ? 2 : 3) + '" stroke-linejoin="round" stroke-linecap="round"' +
      (l.dashed ? ' stroke-dasharray="5 5"' : '') + '><title>' + esc(l.name) + '</title></path>';
  });
  return out + '</svg>';
}

}

/** Pick black or white text, whichever reads better on a hex colour. */
function textOn(hex) {
  var m = /^#([0-9a-f]{6})$/i.exec(hex || '');

  var n = parseInt(m[1], 16);
  var lin = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  var L = 0.2126 * lin(n >> 16 & 255) + 0.7152 * lin(n >> 8 & 255) + 0.0722 * lin(n & 255);
  return (1.05 / (L + 0.05)) >= ((L + 0.05) / 0.05) ? '#ffffff' : '#111a17';
}

    '<div class="hero-figure">' + esc(figure) + per + '</div>' +
    '<div class="hero-bar"><div class="bar" aria-hidden="true"><span style="width:' + (clamp(fraction, 0, 1) * 100).toFixed(1) + '%;background:' + ringColor + '"></span></div>' +
    '<span class="small muted">' + esc(percent(Math.max(0, fraction))) + ' of income left</span></div>' +
    '<p class="hero-note">' + esc(note) + ' It is a rough guide, not financial advice.</p></div></section>';

  var stats = '<div class="grid grid-4 mt">' +
    statCard('Income', t.income, 'var(--income)') +
    statCard('Spent', t.spent, 'var(--spend)') +
    statCard('Bills still due', t.billsDue, 'var(--warn)') +
    statCard('Left', t.left, 'var(--accent)', t.left < 0 ? 'bad' : '') + '</div>';

  return head + hero + stats + overviewGlance(m) +
    '<div class="grid grid-2 mt">' + overviewDonut(m) + overviewBills(m) + '</div>' +
    '<div class="grid grid-2 mt">' + overviewBudgetCheck(m) + overviewSixMonths(m) + '</div>';
}

function overviewDonut(m) {
  var by = spendingByCategory(m);
  var rows = Object.keys(by).map(function (id) { return { id: id, value: by[id], label: catName(id), color: catColor(id) }; })
    .sort(function (a, b) { return b.value - a.value; });
  var total = rows.reduce(function (s, r) { return s + r.value; }, 0);
  if (rows.length > 6) {
    var rest = rows.slice(5).reduce(function (s, r) { return s + r.value; }, 0);
    rows = rows.slice(0, 5).concat([{ id: '', value: rest, label: 'Everything else', color: '#9aa5a1' }]);
  }
  var body;
  if (!total) {
    body = emptyState('No spending yet', ' Money you spend in ' + monthLabel(m) + ' will show up here by category.',
      '<button type="button" class="btn small" data-action="quick-add">' + icon('plus', 16) + 'Add spending</button>');
  } else {
    body = '<div class="donut-wrap">' + donutSvg(rows, 180, money(total), 'spent') +
      '<ul class="list donut-list">' + rows.map(function (r) {
        return '<li><span class="dot" style="background:' + esc(r.color) + '"></span><span class="li-main">' + esc(r.label) +
          ' <span class="muted small">' + esc(percent(r.value / total)) + '</span></span><span class="li-amount">' + esc(money(r.value)) + '</span></li>';
      }).join('') + '</ul></div>';
  }
  return '<section class="card" aria-labelledby="donutH"><div class="card-head"><h2 id="donutH">Spending by category</h2></div>' + body + '</section>';
}

function overviewBills(m) {
  var today = todayStr();
  var now = thisMonth();
  var due = data.bills.filter(function (b) { return !billPayment(b, m); })
    .sort(function (a, b) { return a.dueDay - b.dueDay; });
  var body;
  if (!data.bills.length) {
    body = emptyState('No bills yet', ' Add rent, phone, streaming and other regular bills to see what is coming up.',
      '<button type="button" class="btn small" data-action="nav" data-page="bills">Add a bill</button>');
  } else if (!due.length) {
    body = emptyState('All paid', ' Every bill for ' + monthLabel(m) + ' is marked as paid.');
  } else {
    body = '<ul class="list wrap-sm">' + due.slice(0, 5).map(function (b) {
      var date = dueDateIn(m, b.dueDay);
      var when = dateLabel(date, { day: 'numeric', month: 'short' });
      var status = '';
      if (m === now) {
        var diff = dayDiff(today, date);
        if (diff < 0) status = '<span class="pill bad">' + (-diff) + (diff === -1 ? ' day late' : ' days late') + '</span>';
        else if (diff === 0) status = '<span class="pill warn">Due today</span>';
        else if (diff <= 7) status = '<span class="pill warn">In ' + diff + (diff === 1 ? ' day' : ' days') + '</span>';
      } else if (m < now) {
        status = '<span class="pill bad">Not marked paid</span>';
      }
      return '<li>' + badge(String(Math.min(b.dueDay, daysInMonth(m))), catColor(b.categoryId)) +
        '<div class="li-main"><div class="li-title">' + esc(b.name) + '</div><div class="li-sub">Due ' + esc(when) + ' ' + status + '</div></div>' +
        '<span class="li-amount">' + esc(money(b.amount)) + '</span>' +
        '<button type="button" class="btn small" data-action="bill-pay" data-id="' + esc(b.id) + '" aria-label="Mark ' + esc(b.name) + ' as paid">' + icon('check', 16) + '<span class="hide-xs">Paid</span></button></li>';
    }).join('') + '</ul>' + (due.length > 5 ? '<p class="small muted mt">And ' + (due.length - 5) + ' more on the Bills page.</p>' : '');
  }
  return '<section class="card" aria-labelledby="dueH"><div class="card-head"><h2 id="dueH">Bills due soon</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="bills">See all</button></div>' + body + '</section>';
}

function overviewBudgetCheck(m) {
  var by = spendingByCategory(m);
  var rows = categoriesOf('expense').filter(function (c) { return c.budget > 0 || by[c.id]; }).map(function (c) {
    var spent = by[c.id] || 0;
    return { c: c, spent: spent, diff: c.budget - spent, ratio: c.budget > 0 ? spent / c.budget : (spent > 0 ? 2 : 0) };
  }).sort(function (a, b) { return b.ratio - a.ratio; });
  var body;
  if (!categoriesOf('expense').some(function (c) { return c.budget > 0; })) {
    body = emptyState('No budget set', ' Set a monthly amount for each kind of spending to see how you are doing.',
      '<button type="button" class="btn small" data-action="nav" data-page="budget">Set a budget</button>');
  } else {
    body = '<ul class="list">' + rows.slice(0, 6).map(function (r) {
      var over = r.diff < 0;
      var pill = r.c.budget === 0 ? '<span class="pill warn">No budget</span>' :
        over ? '<span class="pill bad">' + esc(money(-r.diff)) + ' over</span>' : '<span class="pill good">' + esc(money(r.diff)) + ' left</span>';
      return '<li><div class="li-main"><div class="row"><span class="li-title">' + esc(r.c.name) + '</span><span class="spacer"></span>' + pill + '</div>' +
        '<div class="bar' + (over ? ' over' : '') + '" style="margin:6px 0 4px" aria-hidden="true"><span style="width:' + clamp(r.ratio * 100, 0, 100).toFixed(1) + '%;background:' + (over ? '' : esc(r.c.color)) + '"></span></div>' +
        '<div class="li-sub">' + esc(money(r.spent)) + ' of ' + esc(money(r.c.budget)) + '</div></div></li>';
    }).join('') + '</ul>';
  }
  return '<section class="card" aria-labelledby="budH"><div class="card-head"><h2 id="budH">Budget check</h2>' +
    '<button type="button" class="btn ghost small" data-action="nav" data-page="budget">See all</button></div>' + body + '</section>';
}

function overviewSixMonths(m) {
  var groups = [];
  for (var i = -5; i <= 0; i++) {
    var key = addMonths(m, i);
    var t = monthTotals(key);
    groups.push({ label: monthName(Number(key.slice(5, 7)) - 1), a: t.income, b: t.spent });
  }
  var series = [{ name: 'Income', color: 'var(--income)' }, { name: 'Spending', color: 'var(--spend)' }];
  var aria = 'Income and spending for the last six months: ' + groups.map(function (g) {
    return g.label + ' income ' + money(g.a) + ', spending ' + money(g.b);
  }).join('; ');
  return '<section class="card" aria-labelledby="sixH"><div class="card-head"><h2 id="sixH">Last 6 months</h2>' +
    '<p class="muted small">Income compared with spending</p></div>' +
    barsSvg(groups, series, aria, 5, chartWidth(true)) + legend(series) + '</section>';
}

/* ----- Transactions ----- */
function txFormFields(idp, v) {
  var dec = localeDecimal();
  return '<div class="field"><span id="' + idp + 'TypeL">Type</span><div class="seg" role="radiogroup" aria-labelledby="' + idp + 'TypeL">' +
    '<label><input type="radio" name="type" value="expense"' + (v.type !== 'income' ? ' checked' : '') + '><span>Money out</span></label>' +
    '<label><input type="radio" name="type" value="income"' + (v.type === 'income' ? ' checked' : '') + '><span>Money in</span></label></div></div>' +
    '<label class="field"><span>Amount</span><input class="input money" id="' + idp + 'Amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0' + dec + '00" value="' + esc(v.amount || '') + '" aria-describedby="' + idp + 'Err"></label>' +
    '<label class="field"><span>Category</span><select class="input" id="' + idp + 'Cat" name="category" data-cat-select>' + categoryOptions(v.type === 'income' ? 'income' : 'expense', v.category) + '</select></label>' +
    '<label class="field"><span>Date</span><input class="input" type="date" id="' + idp + 'Date" name="date" value="' + esc(v.date || todayStr()) + '" required></label>' +
    '<label class="field"><span>Note <span class="muted">(optional)</span></span><input class="input" id="' + idp + 'Note" name="note" maxlength="140" autocomplete="off" value="' + esc(v.note || '') + '" placeholder="What was it for?"></label>';
}

function categoryOptions(type, selected) {
  var cats = categoriesOf(type);
  if (!cats.some(function (c) { return c.id === selected; })) selected = cats.length ? cats[0].id : '';
  return cats.map(function (c) {
    return '<option value="' + esc(c.id) + '"' + (c.id === selected ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  }).join('');
}

function defaultTxDate() {
  return ui.month === thisMonth() ? todayStr() : ui.month + '-01';
}

function pageTransactions() {
  var f = ui.txFilters;
  var form = '<section class="card" aria-labelledby="addH"><div class="card-head"><h2 id="addH">Add a transaction</h2></div>' +
    '<form data-form="tx-add" data-draft="txAdd" novalidate><div class="form-grid">' +
    txFormFields('ta', { type: 'expense', date: defaultTxDate() }) +
    '<button type="submit" class="btn primary">' + icon('plus', 18) + 'Add transaction</button></div>' +
    '<p class="error-msg" id="taErr" role="alert"></p></form></section>';

  var catOpts = '<option value="all">All categories</option>' + data.categories.map(function (c) {
    return '<option value="' + esc(c.id) + '"' + (f.category === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  }).join('');
  var filters = '<div class="filters" role="search">' +
    '<label class="field f-search"><span class="sr-only">Search transactions</span><input class="input" type="search" id="fSearch" data-filter="search" placeholder="Search notes, categories or amounts" value="' + esc(f.search) + '"></label>' +
    '<label class="field"><span class="sr-only">Type</span><select class="input" id="fType" data-filter="type">' +
    '<option value="all"' + (f.type === 'all' ? ' selected' : '') + '>Money in and out</option>' +
    '<option value="expense"' + (f.type === 'expense' ? ' selected' : '') + '>Money out</option>' +
    '<option value="income"' + (f.type === 'income' ? ' selected' : '') + '>Money in</option></select></label>' +
    '<label class="field"><span class="sr-only">Category</span><select class="input" id="fCat" data-filter="category">' + catOpts + '</select></label>' +
    '<label class="field"><span class="sr-only">Months</span><select class="input" id="fScope" data-filter="scope">' +
    '<option value="month"' + (f.scope === 'month' ? ' selected' : '') + '>' + esc(monthLabel(ui.month)) + '</option>' +
    '<option value="all"' + (f.scope === 'all' ? ' selected' : '') + '>All months</option></select></label></div>';

  return pageHead('Transactions', 'Everything you earn and spend.', monthButton()) + form +
    '<section class="card mt" aria-labelledby="listH"><div class="card-head"><h2 id="listH">Your transactions</h2></div>' +
    filters + '<div id="txList">' + txListHtml() + '</div></section>';
}

function filteredTransactions() {
  var f = ui.txFilters;
  var q = f.search.trim().toLowerCase();
  return data.transactions.filter(function (t) {
    if (f.scope !== 'all' && t.date.slice(0, 7) !== ui.month) return false;
    if (f.type !== 'all' && t.type !== f.type) return false;
    if (f.category !== 'all' && t.categoryId !== f.category) return false;
    if (q) {
      var hay = (t.note + ' ' + catName(t.categoryId) + ' ' + centsToPlain(t.amount) + ' ' + money(t.amount)).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function (a, b) { return a.date === b.date ? (a.id < b.id ? 1 : -1) : (a.date < b.date ? 1 : -1); });
}

function txListHtml() {
  var list = filteredTransactions();
  var inSum = 0, outSum = 0;
  list.forEach(function (t) { if (t.type === 'income') inSum += t.amount; else outSum += t.amount; });
  if (!list.length) {
    var any = data.transactions.length > 0;
    return emptyState(any ? 'Nothing matches' : 'No transactions yet',
      any ? ' Try a different search, or choose “All months”.' : ' Add your first one with the form above.');
  }
  var out = '<p class="small muted">' + list.length + (list.length === 1 ? ' transaction' : ' transactions') +
    '. Money in: ' + esc(money(inSum)) + '. Money out: ' + esc(money(outSum)) + '.</p>';
  var lastDate = '';
  var shown = list.slice(0, txLimit);
  var open = false;
  shown.forEach(function (t) {
    if (t.date !== lastDate) {
      if (open) out += '</ul>';
      out += '<h3 class="day-head">' + esc(dateLabel(t.date, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' })) + '</h3><ul class="list wrap-sm">';
      open = true;
      lastDate = t.date;
    }
    var title = t.note || catName(t.categoryId);
    out += '<li>' + badge(initials(catName(t.categoryId)), catColor(t.categoryId)) +
      '<div class="li-main"><div class="li-title">' + esc(title) + '</div><div class="li-sub">' + esc(catName(t.categoryId)) +
      (t.billId ? ' <span class="pill neutral">Bill</span>' : '') + '</div></div>' +
      '<span class="li-amount ' + (t.type === 'income' ? 'good' : '') + '">' + esc((t.type === 'income' ? '+' : '−') + money(t.amount)) + '</span>' +
      '<button type="button" class="icon-btn" data-action="tx-edit" data-id="' + esc(t.id) + '" aria-label="Edit ' + esc(title) + '">' + icon('edit', 18) + '</button>' +
      '<button type="button" class="icon-btn" data-action="tx-delete" data-id="' + esc(t.id) + '" aria-label="Delete ' + esc(title) + '">' + icon('trash', 18) + '</button></li>';
  });
  if (open) out += '</ul>';
  if (list.length > shown.length) {
    out += '<div class="row mt" style="justify-content:center"><button type="button" class="btn" data-action="tx-more">Show more (' + (list.length - shown.length) + ' left)</button></div>';
  }
  return out;
}

/* ----- Budget ----- */
function pageBudget() {
  var m = ui.month;
  var by = spendingByCategory(m);
  var t = monthTotals(m);
  var expense = categoriesOf('expense');
  var planned = expense.reduce(function (s, c) { return s + c.budget; }, 0);
  var spentTotal = expense.reduce(function (s, c) { return s + (by[c.id] || 0); }, 0);
  var unplanned = t.income - planned;

  var summary = '<div class="grid grid-3">' +
    statCard('Planned each month', planned, 'var(--accent)') +
    statCard('Spent in ' + monthName(Number(m.slice(5, 7)) - 1, 'long'), spentTotal, 'var(--spend)', spentTotal > planned && planned > 0 ? 'bad' : '') +
    statCard(unplanned >= 0 ? 'Income not yet planned' : 'Planned more than income', Math.abs(unplanned), unplanned >= 0 ? 'var(--income)' : 'var(--bad)', unplanned < 0 ? 'bad' : '') + '</div>';

  var rows = expense.map(function (c) {
    var spent = by[c.id] || 0;
    var ratio = c.budget > 0 ? spent / c.budget : (spent > 0 ? 1 : 0);
    var over = c.budget > 0 ? spent > c.budget : spent > 0;
    var status = c.budget === 0 ? (spent > 0 ? '<span class="pill warn">No budget set</span>' : '') :
      over ? '<span class="pill bad">' + esc(money(spent - c.budget)) + ' over</span>' : '<span class="pill good">' + esc(money(c.budget - spent)) + ' left</span>';
    return '<li><span class="dot" style="background:' + esc(c.color) + '"></span>' +
      '<div class="li-main"><div class="row"><span class="li-title">' + esc(c.name) + '</span>' + status + '</div>' +
      '<div class="bar' + (over ? ' over' : '') + '" style="margin:6px 0 4px" aria-hidden="true"><span style="width:' + clamp(ratio * 100, 0, 100).toFixed(1) + '%' + (over ? '' : ';background:' + esc(c.color)) + '"></span></div>' +
      '<div class="li-sub">Spent ' + esc(money(spent)) + (c.budget ? ' of ' + esc(money(c.budget)) : '') + '</div></div>' +
      '<label class="field" style="width:118px;flex:none"><span class="sr-only">Monthly amount for ' + esc(c.name) + '</span>' +
      '<input class="input money" id="bud-' + esc(c.id) + '" data-budget="' + esc(c.id) + '" inputmode="decimal" autocomplete="off" value="' + esc(c.budget ? centsToInput(c.budget) : '') + '" placeholder="0"></label>' +
      '<button type="button" class="icon-btn" data-action="cat-edit" data-id="' + esc(c.id) + '" aria-label="Rename ' + esc(c.name) + '">' + icon('edit', 18) + '</button></li>';
  }).join('');

  var incomeRows = categoriesOf('income').map(function (c) {
    var got = txInMonth(m).filter(function (x) { return x.categoryId === c.id; }).reduce(function (s, x) { return s + x.amount; }, 0);
    return '<li><span class="dot" style="background:' + esc(c.color) + '"></span><div class="li-main"><div class="li-title">' + esc(c.name) + '</div>' +
      '<div class="li-sub">Received in ' + esc(monthLabel(m)) + '</div></div><span class="li-amount good">' + esc(money(got)) + '</span>' +
      '<button type="button" class="icon-btn" data-action="cat-edit" data-id="' + esc(c.id) + '" aria-label="Rename ' + esc(c.name) + '">' + icon('edit', 18) + '</button></li>';
  }).join('');

  var addForm = '<section class="card mt" aria-labelledby="catAddH"><div class="card-head"><h2 id="catAddH">Add a category</h2></div>' +
    '<form data-form="cat-add" data-draft="catAdd" novalidate><div class="form-grid">' +
    '<label class="field"><span>Name</span><input class="input" id="caName" name="name" maxlength="40" autocomplete="off" placeholder="For example, Pets"></label>' +
    '<label class="field"><span>Kind</span><select class="input" id="caType" name="type"><option value="expense">Spending</option><option value="income">Income</option></select></label>' +
    '<label class="field"><span>Monthly amount <span class="muted">(optional)</span></span><input class="input money" id="caBudget" name="budget" inputmode="decimal" autocomplete="off" placeholder="0"></label>' +
    '<button type="submit" class="btn primary">' + icon('plus', 18) + 'Add category</button></div>' +
    '<p class="error-msg" id="caErr" role="alert"></p></form></section>';

  return pageHead('Budget', 'Plan how much to spend on each thing every month.', monthButton()) + summary +
    '<section class="card mt" aria-labelledby="planH"><div class="card-head"><h2 id="planH">Monthly spending plan</h2>' +
    '<p class="muted small">Type an amount and press Enter. It applies to every month.</p></div><ul class="list wrap-sm">' + rows + '</ul></section>' +
    '<section class="card mt" aria-labelledby="incH"><div class="card-head"><h2 id="incH">Income categories</h2></div><ul class="list">' + incomeRows + '</ul></section>' +
    addForm;
}

/* ----- Bills ----- */
function billFormFields(idp, v) {
  return '<label class="field"><span>Name</span><input class="input" id="' + idp + 'Name" name="name" maxlength="60" autocomplete="off" value="' + esc(v.name || '') + '" placeholder="For example, Rent"></label>' +
    '<label class="field"><span>Amount each month</span><input class="input money" id="' + idp + 'Amount" name="amount" inputmode="decimal" autocomplete="off" value="' + esc(v.amount || '') + '" placeholder="0"></label>' +
    '<label class="field"><span>Due on day</span><input class="input" type="number" id="' + idp + 'Day" name="dueDay" min="1" max="31" inputmode="numeric" value="' + esc(v.dueDay || '') + '" placeholder="1 to 31"></label>' +
    '<label class="field"><span>Category</span><select class="input" id="' + idp + 'Cat" name="category">' + categoryOptions('expense', v.category || 'c-utilities') + '</select></label>' +
    '<label class="check"><input type="checkbox" id="' + idp + 'Sub" name="subscription" value="1"' + (v.subscription ? ' checked' : '') + '><span>This is a subscription</span></label>';
}

function pageBills() {
  var m = ui.month;
  var total = 0, paid = 0, subs = 0;
  data.bills.forEach(function (b) {
    total += b.amount;
    if (billPayment(b, m)) paid += b.amount;
    if (b.subscription) subs += b.amount;
  });
  var stats = '<div class="grid grid-4">' +
    statCard('Bills each month', total, 'var(--accent)') +
    statCard('Paid in ' + monthName(Number(m.slice(5, 7)) - 1, 'long'), paid, 'var(--good)') +
    statCard('Still due', total - paid, 'var(--warn)') +
    statCard('Subscriptions a month', subs, 'var(--spend)') + '</div>';

  var sorted = data.bills.slice().sort(function (a, b) { return a.dueDay - b.dueDay || a.name.localeCompare(b.name); });
  var list = !sorted.length ? emptyState('No bills yet', ' Add the bills you pay every month. You can then tick them off as paid.') :
    '<ul class="list wrap-sm">' + sorted.map(function (b) {
      var p = billPayment(b, m);
      var status = p ? '<span class="pill good">' + icon('check', 14) + 'Paid ' + esc(dateLabel(p.date, { day: 'numeric', month: 'short' })) + '</span>' : '';
      return '<li>' + badge(String(b.dueDay), catColor(b.categoryId)) +
        '<div class="li-main"><div class="li-title">' + esc(b.name) + (b.subscription ? ' <span class="pill neutral">Subscription</span>' : '') + '</div>' +
        '<div class="li-sub">Due on day ' + b.dueDay + ', ' + esc(catName(b.categoryId)) + ' ' + status + '</div></div>' +
        '<span class="li-amount">' + esc(money(b.amount)) + '</span>' +
        (p ? '<button type="button" class="btn small" data-action="bill-unpay" data-id="' + esc(b.id) + '" aria-label="Mark ' + esc(b.name) + ' as not paid">Not paid</button>' :
          '<button type="button" class="btn primary small" data-action="bill-pay" data-id="' + esc(b.id) + '" aria-label="Mark ' + esc(b.name) + ' as paid">' + icon('check', 16) + 'Paid</button>') +
        '<button type="button" class="icon-btn" data-action="bill-edit" data-id="' + esc(b.id) + '" aria-label="Edit ' + esc(b.name) + '">' + icon('edit', 18) + '</button>' +
        '<button type="button" class="icon-btn" data-action="bill-delete" data-id="' + esc(b.id) + '" aria-label="Delete ' + esc(b.name) + '">' + icon('trash', 18) + '</button></li>';
    }).join('') + '</ul>';

  var subList = data.bills.filter(function (b) { return b.subscription; });
  var subCard = '<section class="card" aria-labelledby="subH"><div class="card-head"><h2 id="subH">Subscriptions</h2>' +
    '<p class="muted small">' + esc(money(subs)) + ' a month, about ' + esc(money(subs * 12)) + ' a year</p></div>' +
    (subList.length ? '<ul class="list">' + subList.map(function (b) {
      return '<li><div class="li-main"><div class="li-title">' + esc(b.name) + '</div><div class="li-sub">' + esc(money(b.amount * 12)) + ' a year</div></div>' +
        '<span class="li-amount">' + esc(money(b.amount)) + '</span></li>';
